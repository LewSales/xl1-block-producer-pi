<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XL1 Producer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea;
    --fg: #14171a; --muted: #666e78;
    --ok: #1a7f47; --warn: #a86500; --bad: #b3261e; --accent: #572aff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013; --panel: #171a1f; --line: #262b33;
      --fg: #e8eaed; --muted: #939ba6;
      --ok: #4ec97f; --warn: #e0a341; --bad: #ef6a60; --accent: #8f74ff;
    }
  }

  /* Section accent system. One hue per DATA CATEGORY, not per card -- several
     cards share a category on purpose (Block time and Continuity are both
     "historical analytics", so both read violet). Used narrowly: a left
     border, the heading, the headline metric, and that card's own bars/chart
     -- never a filled card background, which is how the previous version of
     this redesign went too monochromatic and the one before it went rainbow.
     Set per card with style="--c: var(--acc-x)". */
  :root {
    --acc-producer: #1a7f47;  /* producer status / performance -- green */
    --acc-rewards:  #a6720b;  /* rewards / earnings -- gold */
    --acc-network:  #4f46e5;  /* network health -- indigo/purple */
    --acc-chain:    #2f7ae5;  /* chain / finality -- blue */
    --acc-race:     #0891b2;  /* candidate race -- cyan */
    --acc-latency:  #c2540d;  /* latency / timing -- orange */
    --acc-ops:      #0f766e;  /* operations / reliability -- teal */
    --acc-analytics:#7c3aed;  /* historical analytics -- violet */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --acc-producer: #4ec97f;
      --acc-rewards:  #e0a341;
      --acc-network:  #818cf8;
      --acc-chain:    #6aa8ff;
      --acc-race:     #22d3ee;
      --acc-latency:  #ff9d52;
      --acc-ops:      #2dd4bf;
      --acc-analytics:#c4b5fd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  .device { font-weight: 600; font-size: 13px; }
  .net { color: var(--muted); font-size: 13px; }
  .addr { color: var(--muted); font-size: 12px; }
  .updated { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }

  /* Status pill. Four states, not the server's raw three: STALE is derived
     here from node.stale/generatedAt age, layered on top of ok/degraded/down,
     because a header answering "is this live right now" needs to say so even
     when every other signal still reads ok. */
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.03em; border: 1px solid transparent;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .status-pill.online { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: color-mix(in srgb, var(--ok) 32%, transparent); }
  .status-pill.degraded, .status-pill.stale { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
  .status-pill.offline { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 32%, transparent); }
  @media (prefers-reduced-motion: no-preference) {
    .status-pill.online .dot { animation: pulse-dot 2.2s ease-in-out infinite; }
  }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* On a phone the header wrapped into "title + chip", then "chain id + build",
     then the status pill — which buried our own version next to a chain hash it
     has nothing to do with. Narrow screens put the build on its own line
     directly under the title, where it reads as the version OF this thing. */
  @media (max-width: 720px) {
    header { align-items: flex-start; gap: 8px 10px; }
    header h1 { order: 0; }
    header .chip { order: 1; }
    header .device { order: 2; }
    header .brand { order: 3; flex-basis: 100%; margin-top: -2px; }
    header .net { order: 4; }
    header .addr { order: 5; }
    header .updated { order: 6; flex-basis: 100%; }
    header .spacer { display: none; }
    header .status-pill { order: 7; }
  }

  /* Layout. #grid is a single flex column at every width: the KPI row and each
     topic group are full-width blocks stacked top to bottom, and each group's
     OWN grid does the real column work internally. This replaced a CSS
     multi-column masonry that packed 16 differently-coloured cards by height
     alone, with no deliberate mobile order and no way to make one card bigger
     than another on purpose.
     Below 768px, the row/group wrappers become display:contents so their
     children promote to be direct flex items of #grid, and a --mo custom
     property (set per KPI tile / card, alongside nothing else — there is no
     second render path) drives `order` to reproduce one deliberate mobile
     sequence instead of whatever DOM order happened to fall out of a column
     balancer. */
  main#grid { display: flex; flex-direction: column; gap: 20px; padding: 20px; max-width: 1720px; margin: 0 auto; }
  .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  @media (max-width: 1023px) { .kpi-row { grid-template-columns: repeat(3, 1fr); } }
  /* dense: a card spanning 2 columns leaves a 1-column gap beside it at its own
     row height, and without dense that gap stays empty until the grid runs out
     of items -- a later small card jumps down to start a fresh row instead of
     filling it. Dense back-fills it with whatever comes next that still fits,
     which is what stops three small cards from sitting above a large empty
     rectangle the fourth, bigger card left behind. */
  .group-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-flow: dense; gap: 16px; align-items: start; }
  @media (max-width: 1279px) { .group-grid { grid-template-columns: repeat(2, 1fr); } }
  .card-lg { grid-column: span 2; }
  .card-full { grid-column: 1 / -1; }
  @media (max-width: 767px) {
    main#grid { display: flex; }
    .kpi-row, .group, .group-grid { display: contents; }
    .group-heading { display: none; }
    [style*="--mo"] { order: var(--mo); }
  }
  /* A section is a heading and a divider, not another bordered box around its
     cards -- that would be a fourth layer of box-in-box (page, section, card,
     mini metric tile) for a grouping that only needs to read as structural. */
  .group-heading {
    margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 7px;
  }

  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; position: relative; overflow: hidden; }
  section h2 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 7px; }
  /* The category accent, applied narrowly: a 3px left border and the heading
     colour identify what a card is about before its title is read; the
     headline metric picks it up too unless that number is already a status
     colour (ok/warn/bad), which always wins over category identity. Bars,
     sparklines and charts pick the same variable up further down -- one
     switch per card, not per element. Most of the card stays neutral. */
  section[style*="--c"] { border-left: 3px solid var(--c); }
  section[style*="--c"] h2 { color: var(--c); }
  section[style*="--c"] .big:not(.ok):not(.warn):not(.bad) { color: var(--c); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; align-items: baseline; font-size: 13px; }
  dt { color: var(--muted); white-space: nowrap; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .big { font-size: 23px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
  /* var(--c, var(--accent)): --c is set on the ancestor <section> and inherits
     straight down, so a bar inside a category-accented card picks up that
     colour with no extra selector; a card with no --c falls back to the plain
     accent. Value-based colours (warn/bad below) always take priority. */
  .bar > i { display: block; height: 100%; background: var(--c, var(--accent)); }
  .bar > i.warn { background: var(--warn); } .bar > i.bad { background: var(--bad); }
  ul.problems { margin: 10px 0 0; padding-left: 18px; color: var(--warn); }
  /* Standings. A wide table on a 480px phone must scroll inside its own box
     rather than stretching the page sideways. */
  .board-wrap { overflow-x: auto; margin-top: 4px; }
  table.board { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.board th { text-align: right; font-weight: 600; color: var(--muted); padding: 4px 6px; white-space: nowrap; }
  table.board th:nth-child(2) { text-align: left; }
  table.board td { padding: 4px 6px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.board td:nth-child(2) { text-align: left; }
  /* This node's own row: green/primary, not the table's network-purple --
     "which row is mine" is a different question from "what kind of data is
     this table", and conflating the two made the self row disappear into the
     rest of the purple. A left border carries it past a quick glance, the
     same way the row tint alone did not. */
  table.board tr.self { background: color-mix(in srgb, var(--acc-producer) 16%, transparent); font-weight: 650;
    box-shadow: inset 3px 0 0 0 var(--acc-producer); }
  table.board tr + tr td { border-top: 1px solid var(--line); }
  table.board tr.gap td { border-top: 2px dashed var(--line); }
  table.board tr.self .peer-bar > i { background: var(--acc-producer); }
  table.board td.barcell { width: 40%; padding-left: 14px; }
  .peer-name { font-weight: 600; margin-right: 4px; }
  /* Other producers' identity links: the network accent, so a name you can
     click reads as "network" data at a glance, same as the card it sits in. */
  table.board td a.mono { color: var(--acc-network); }
  table.board tr.self td a.mono { color: inherit; }
  /* Four columns stretched across a 1280px card put the name and its numbers at
     opposite edges, which is a lot of eye travel to compare two rows. */
  table.board { max-width: 760px; }
  .you-badge {
    display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
    padding: 1px 5px; border-radius: 999px; background: var(--accent); color: #fff;
    margin-left: 4px; vertical-align: 1px;
  }
  /* Candidate race. The pulse is one cell per chain block, oldest left, so the
     eye reads recency rightward the way the log does. Sized to stay legible at
     64 cells on a phone without a media query. */
  .pulse { display: flex; gap: 2px; align-items: flex-end; margin: 6px 0 2px; }
  .pulse > i { flex: 1 1 0; min-width: 2px; height: 14px; border-radius: 1px;
               background: color-mix(in srgb, var(--line) 80%, transparent); }
  .pulse > i.win { background: var(--c, var(--accent)); height: 20px; }
  /* Colour is not the only signal: a win is also taller. */
  .reason-stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); margin: 8px 0 2px; }
  .reason-stack > i { display: block; height: 100%; background: color-mix(in srgb, var(--warn) 65%, transparent); border-right: 1px solid var(--panel); }
  .reason-stack > i:last-child { border-right: 0; }
  .reason { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; margin-top: 6px; }
  .reason-bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .reason-bar > i { display: block; height: 100%; background: color-mix(in srgb, var(--warn) 65%, transparent); }
  .score-row { display: grid; grid-template-columns: 7.5em 2.5em 1fr; gap: 3px 8px; align-items: center; margin-top: 5px; }
  .score-bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .score-bar > i { display: block; height: 100%; background: color-mix(in srgb, var(--ok) 65%, transparent); }
  .score-bar.mid > i { background: color-mix(in srgb, var(--warn) 65%, transparent); }
  .score-bar.low > i { background: color-mix(in srgb, var(--bad) 65%, transparent); }
  .conf { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .lat-row { display: grid; grid-template-columns: 5.5em 5em 1fr; gap: 4px 8px; align-items: center; margin-top: 5px; }
  .lat-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .lat-bar > i { display: block; height: 100%; background: color-mix(in srgb, var(--c, var(--accent)) 70%, transparent); }
  .lat-bar.wire > i { background: color-mix(in srgb, var(--ok) 70%, transparent); }
  .lat-bar.tail > i { background: color-mix(in srgb, var(--warn) 70%, transparent); }
  /* Identity disclosure. <details> rather than a JS toggle: it is keyboard
     reachable, works with the page's own find-in-page, and costs no script. */
  details.ident { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  details.ident > summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; }
  details.ident > summary::-webkit-details-marker { display: none; }
  details.ident > summary::before { content: '▸ '; }
  details.ident[open] > summary::before { content: '▾ '; }
  details.ident > summary:hover, details.ident > summary:focus-visible { color: var(--fg); }
  details.ident dl { margin-top: 6px; }
  .peer-bar { height: 7px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 60px; }
  .peer-bar > i { display: block; height: 100%; background: color-mix(in srgb, var(--c, var(--accent)) 70%, transparent); }
  .alert-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline;
    padding: 5px 0; border-top: 1px solid var(--line); }
  .alert-row:first-child { border-top: 0; }
  .alert-dot { font-size: 11px; line-height: 1; }
  .conc-bar { display: flex; gap: 2px; height: 12px; margin-top: 12px; border-radius: 3px; overflow: hidden; background: var(--line); }
  .conc-bar > i { display: block; height: 100%; background: color-mix(in srgb, var(--c, var(--accent)) 75%, transparent); }
  /* The producers whose combined share crosses the Nakamoto coefficient get an
     outline rather than a second colour — colour alone would fight the
     self-highlight green already used on this same bar. */
  .conc-bar > i.nk { outline: 2px solid var(--fg); outline-offset: -2px; }
  /* Fixed height so the card does not resize as the distribution shifts. */
  .hist-wrap { position: relative; }
  .hist { display: flex; align-items: flex-end; gap: 2px; height: 96px; margin: 14px 0 6px; }
  .hist-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; }
  .hist-bar { background: color-mix(in srgb, var(--c, var(--accent)) 70%, transparent); border-radius: 2px 2px 0 0; }
  /* Two named overrides for the rare chart that represents a different
     category than the card it lives in -- Continuity and the "blocks/day"
     half of Trends are production data inside an analytics-violet card, and
     "XL1/day" is earnings data in the same card. Everything else just
     inherits --c from its own section, no override needed. */
  .acc-green .hist-bar, .acc-green .trendbar-fill { background: color-mix(in srgb, var(--acc-producer) 70%, transparent); }
  .acc-gold .hist-bar, .acc-gold .trendbar-fill { background: color-mix(in srgb, var(--acc-rewards) 70%, transparent); }
  .hist-x { font-size: 9px; color: var(--muted); text-align: center; padding-top: 3px;
    overflow: hidden; text-overflow: clip; white-space: nowrap; }
  /* Percentile markers over the block-time histogram, positioned by the same
     seconds axis the bars already use. Purely a CSS overlay — no new data,
     no new request. */
  .hist-tick { position: absolute; top: 0; bottom: 16px; width: 0; border-left: 1px dashed var(--muted); pointer-events: none; }
  .hist-tick span { position: absolute; top: -13px; left: 3px; font-size: 9px; color: var(--muted); white-space: nowrap; }
  .drift-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: baseline;
    padding: 4px 0; border-top: 1px solid var(--line); font-size: 12px; }
  pre.log {
    margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px;
    max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  footer { padding: 0 20px 28px; color: var(--muted); font-size: 12px; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .err { color: var(--bad); font-size: 12.5px; }

  /* Stat tiles. A dense grid reads faster than a long definition list once
     there are more than about six figures to take in at a glance. */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; margin-top: 10px; }
  /* No border: a card already has one, and a mini stat box with its own
     border inside it is the box-in-box effect this pass reduces. The tint
     against the panel is enough to separate it without a fourth outline. */
  .tile { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .tile .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .tile .v { font-size: 19px; font-weight: 640; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .tile .n { color: var(--muted); font-size: 11px; margin-top: 2px; }

  /* KPI row. Deliberately bigger and plainer than a .tile: this is the answer
     to "how is it doing", read in the first five seconds, so it outweighs
     everything below it rather than matching it. */
  /* --k (set per tile, e.g. style="--k: var(--acc-producer)") gives each KPI a
     hairline top border tied to its meaning -- deliberately the lightest
     touch in the whole accent system, since point 3 asks for a stat these
     numbers outrank, not a coloured card. */
  .kpi { background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--k, var(--line)); border-radius: 10px; padding: 14px 16px; }
  .kpi .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .kpi .k .ico { font-size: 12px; }
  .kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .kpi .v.sub { font-size: 16px; color: var(--muted); font-weight: 600; }
  .kpi .v.bad { color: var(--bad); }
  .kpi .n { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

  /* Sparklines. preserveAspectRatio="none" stretches the box to the card, so
     the stroke needs non-scaling-stroke or it thins out as the card widens. */
  .spark { display: block; width: 100%; height: 40px; margin-top: 12px; overflow: visible; }
  .spark path.line { fill: none; stroke: var(--c, var(--accent)); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .spark path.area { fill: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); stroke: none; }
  .spark rect { fill: color-mix(in srgb, var(--c, var(--accent)) 70%, transparent); }
  .spark.ok path.line { stroke: var(--ok); } .spark.ok path.area { fill: color-mix(in srgb, var(--ok) 13%, transparent); }
  .spark.ok rect { fill: color-mix(in srgb, var(--ok) 70%, transparent); }
  .sparkfoot { display: flex; justify-content: space-between; color: var(--muted); font-size: 10.5px; margin-top: 3px; }
  .trendbars { display: flex; align-items: flex-end; gap: 4px; margin-top: 10px; }
  .trendbar { flex: 1 1 0; min-width: 8px; display: flex; flex-direction: column; align-items: stretch; }
  .trendbar-fill { border-radius: 3px 3px 0 0; background: var(--c, var(--accent)); min-height: 3px; }
  .trendbar { height: 56px; justify-content: flex-end; }
  .trendbar-n { font-size: 10px; color: var(--muted); text-align: center; margin-top: 3px;
                font-variant-numeric: tabular-nums; }
  .brand { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .brand a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--line); }
  .brand a:hover, .brand a:focus-visible { color: var(--fg); border-bottom-color: currentColor; }
  .credits { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line);
             display: grid; gap: 4px; line-height: 1.45; }
  .credits a { color: var(--accent); }
  .origin { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .brand svg { flex: none; }
  .ico { font-size: 14px; line-height: 1; filter: saturate(1.1); }

  /* Info tooltip. A bare title="" is not reliably keyboard-discoverable, so the
     glyph is a focusable element and the explanation also appears on
     :focus-visible, not only :hover — the same text either way, since this is
     a native title attribute, not a rendered popover. */
  .info { display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line);
    color: var(--muted); font-size: 10px; font-style: normal; line-height: 1;
    background: none; padding: 0; cursor: help; font-family: inherit; }
  .info:hover, .info:focus-visible { color: var(--fg); border-color: var(--muted); }

  /* Attribution. Deliberately plain — it is a disclaimer, not a badge. */
  .whose {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  }
  .whose .who { font-weight: 600; color: var(--fg); }
  .whose .sep { color: var(--line); }
  .chip {
    font-size: 10.5px; padding: 2px 7px; border-radius: 999px; font-weight: 600;
    letter-spacing: 0.03em; border: 1px solid var(--line); color: var(--muted);
    white-space: nowrap;
  }
  .logfoot { color: var(--muted); font-size: 11px; margin-top: 7px; }
  .banner {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12.5px;
    border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
    background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--fg);
  }
  .banner b { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>⛏️ XL1 Block Producer</h1>
  <span class="chip" title="An independent project. Not built, endorsed, or supported by XYO.">unofficial</span>
  <span class="device mono" id="device" hidden></span>
  <span class="net" id="net">—</span>
  <span class="addr mono" id="hdraddr" hidden></span>
  <span class="spacer"></span>
  <span class="updated" id="updated" hidden></span>
  <!-- Build identity, next to the mark. Inline SVG rather than an image file:
       one less request, scales at any size, and it takes its colour from the
       theme instead of shipping two versions. currentColor for the ring so it
       reads in light and dark; the gold bars are the only fixed colour. -->
  <span class="brand" id="brand" hidden>
    <span id="brandmark"></span>
    <a class="mono" id="build" target="_blank" rel="noopener noreferrer">—</a>
  </span>
  <span class="status-pill" id="overall"><span class="dot" aria-hidden="true"></span>connecting…</span>
</header>
<main id="grid"></main>
<footer id="foot">—</footer>

<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const num = (n) => (n === undefined || n === null || Number.isNaN(n)) ? '—' : Number(n).toLocaleString()
const bytes = (b) => {
  if (!b && b !== 0) return '—'
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; let v = b
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++ }
  return `${v.toFixed(v < 10 && i > 0 ? 1 : 0)} ${u[i]}`
}
const dur = (s) => {
  if (s === undefined || s === null) return '—'
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60)
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`
}
// Forty hex characters twice over dominated cards for something an operator
// verifies once and then never reads again — used wherever a full address
// would otherwise crowd out the number the card is actually about.
const shortAddr = (a) => `${String(a ?? '').slice(0, 6)}…${String(a ?? '').slice(-4)}`
// A focusable info glyph rather than a bare title="" on running text: the
// same explanation, but reachable with a keyboard and revealed on
// :focus-visible as well as :hover.
const info = (title) => `<button type="button" class="info" title="${esc(title)}" aria-label="${esc(title)}">i</button>`

// Provenance marks. xl1-cli is XYO's own software; this dashboard is not, and
// the page says so in the header already. Putting the two side by side in
// Software & host makes the distinction concrete where the versions are read:
// one line is theirs, the next is ours.
//
// The XYO mark is drawn as a plain hexagon outline rather than a facsimile of
// their logo — enough to read as "theirs" without passing itself off as their
// trademark on a page that exists to say it is unaffiliated.
const MARK_XYO = `<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="vertical-align:-1px">
  <path d="M12 2.5 L20.5 7.25 L20.5 16.75 L12 21.5 L3.5 16.75 L3.5 7.25 Z"
        fill="none" stroke="currentColor" stroke-width="2"/></svg>`
const MARK_OXYON = `<svg viewBox="0 0 48 48" width="12" height="12" aria-hidden="true" style="vertical-align:-1px">
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="butt">
    <path d="M23 5 A19 19 0 0 0 23 43"/><path d="M25 5 A19 19 0 0 1 25 43"/>
    <path d="M11.5 16 L21 24 L11.5 32"/><path d="M36.5 16 L27 24 L36.5 32"/>
  </g>
  <rect x="9" y="22" width="12" height="4" fill="#c99a3b"/>
  <rect x="27" y="22" width="12" height="4" fill="#c99a3b"/></svg>`
const origin = (kind, b = {}) => {
  const link = (href, title, inner) => href
    ? `<a class="origin" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(title)}">${inner}</a>`
    : `<span class="origin" title="${esc(title)}">${inner}</span>`
  return kind === 'official'
    ? link(b.upstreamUrl, `xl1-cli is ${b.upstreamName ?? 'XYO'}'s own software, running unmodified in the container`,
        `${MARK_XYO} official`)
    : link(b.brandUrl, `This dashboard is an independent project by ${b.brandName ?? 'the operator'} — not built, endorsed, or supported by XYO`,
        `${MARK_OXYON} unofficial`)
}

const dl = (rows) => `<dl>${rows.filter(Boolean).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`
const tiles = (items) => `<div class="tiles">${items.filter(Boolean).map(([k, v, n]) =>
  `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ''}</div>`).join('')}</div>`

/** A sparkline of the CHANGE between samples, for series that only ever rise.
 *
 *  Height and reward balance are cumulative counters, so plotting the value
 *  draws a line that goes up and to the right no matter what the node did —
 *  the same picture whether it won ten blocks or none, because the axis
 *  rescales. The delta answers the question actually being asked: WHEN did
 *  something happen, and how much.
 *
 *  It reads especially well for rewards, where the chain pays in fixed 50 XL1
 *  steps: every bar is a block won, and the gaps between bars are the dry
 *  spells. `summary` turns the same numbers into one line of plain language,
 *  because a bar chart with no scale is still just a shape.
 */
const sparkDelta = (series, cls = '', summary) => {
  const pts = (series ?? []).map(Number).filter((v) => !Number.isNaN(v))
  if (pts.length < 3) return `<div class="sub" style="margin-top:10px">collecting — needs a few more samples</div>`
  // Negative steps mean a restart or a reset, not a loss. Clamped rather than
  // drawn, so one counter reset cannot invert the whole chart.
  const deltas = []
  for (let i = 1; i < pts.length; i++) deltas.push(Math.max(0, pts[i] - pts[i - 1]))
  const max = Math.max(...deltas) || 1
  const total = deltas.reduce((a, b) => a + b, 0)
  const active = deltas.filter((d) => d > 0).length
  const W = 100, H = 40
  const bw = W / deltas.length
  const bars = deltas.map((v, i) => {
    // A zero stays visibly zero; anything above it gets at least a sliver so a
    // small step is not indistinguishable from nothing happening.
    const h = v === 0 ? 0 : Math.max(1.5, (v / max) * H)
    return `<rect x="${(i * bw).toFixed(2)}" y="${(H - h).toFixed(2)}" width="${Math.max(0.6, bw * 0.8).toFixed(2)}" height="${h.toFixed(2)}"/>`
  }).join('')
  const fmt = (v) => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : Number(v.toFixed(2)).toLocaleString()
  return `<svg class="spark ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>
    <div class="sparkfoot"><span>${summary ? summary(total, active, deltas.length, max) : `+${fmt(total)}`}</span><span>${deltas.length} intervals</span></div>`
}

/** A sparkline from a history series. Says "collecting" rather than drawing a
 *  flat line from one point — an empty chart that looks like a dead one is
 *  worse than an honest label. */
const spark = (series, cls = '') => {
  const pts = (series ?? []).map(Number).filter((v) => !Number.isNaN(v))
  if (pts.length < 2) return `<div class="sub" style="margin-top:10px">collecting — needs a few more samples</div>`
  const min = Math.min(...pts), max = Math.max(...pts), span = (max - min) || 1
  const W = 100, H = 40
  const d = pts.map((v, i) => `${((i / (pts.length - 1)) * W).toFixed(2)},${(H - ((v - min) / span) * H).toFixed(2)}`)
  const fmt = (v) => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : Number(v.toFixed(2)).toLocaleString()
  return `<svg class="spark ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path class="area" d="M0,${H} L${d.join(' L')} L${W},${H} Z"/>
      <path class="line" d="M${d.join(' L')}"/>
    </svg>
    <div class="sparkfoot"><span>${fmt(min)}</span><span>${pts.length} samples</span><span>${fmt(max)}</span></div>`
}

const bar = (pct, warnAt = 70, badAt = 90) => {
  const p = Math.max(0, Math.min(100, pct ?? 0))
  const cls = p >= badAt ? 'bad' : p >= warnAt ? 'warn' : ''
  return `<div class="bar"><i class="${cls}" style="width:${p}%"></i></div>`
}

// Four states, derived client-side from what the server already sends. STALE
// sits at a shorter threshold (60s) than the server's own node.stale cutoff
// (120s) so the header can flag lag before that stricter threshold even
// trips; it is a presentation choice layered on top, not a second source of
// truth. Precedence: a fetch failure or 'down' always wins, staleness beats a
// merely 'degraded' status, and anything else is fine.
const HEADER_STALE_MS = 60000
function headerState(d, fetchFailed) {
  if (fetchFailed) return 'offline'
  if (d.status === 'down') return 'offline'
  const genAge = d.generatedAt ? (Date.now() - new Date(d.generatedAt).getTime()) : Infinity
  if (d.node?.stale || genAge > HEADER_STALE_MS) return 'stale'
  if (d.status === 'degraded') return 'degraded'
  return 'online'
}
function setStatusPill(state, label) {
  const el = $('overall')
  el.className = `status-pill ${state}`
  el.innerHTML = `<span class="dot" aria-hidden="true"></span>${esc(label ?? state.toUpperCase())}`
}

// The five numbers that answer "how is it doing" before anything else on the
// page is read. Every one is a re-read of a field the rest of the page
// already renders elsewhere — nothing here is computed twice, and nothing
// here costs a request the polling loop was not already making.
function kpiRow(d) {
  const dv = d.derived ?? {}
  const pb = d.peers ?? {}
  const bw = dv.blocksByWindow ?? {}
  // acc: a hairline top border tying each KPI to the same category colours
  // used below -- the lightest touch in the accent system, on purpose, since
  // these five numbers are meant to outrank everything else on the page, not
  // share a colour with it.
  const tile = (mo, icon, k, v, n, cls = '', acc = '--line') => `<div class="kpi" style="--k: var(${acc}); --mo:${mo}">
    <div class="k"><span class="ico" aria-hidden="true">${icon}</span>${esc(k)}</div><div class="v${cls ? ' ' + cls : ''}">${v}</div>${n ? `<div class="n">${esc(n)}</div>` : ''}
  </div>`

  const blocksWon = dv.producedObserved !== undefined ? dv.producedObserved
    : (pb.self?.blocks !== undefined ? pb.self.blocks : undefined)
  const rankVal = pb.selfRank !== undefined ? `#${num(pb.selfRank)}` : '—'
  const rankSub = pb.selfRank !== undefined ? `of ${num(pb.producers)} producers` : 'not seen yet'
  const last24 = bw.day24h
  const last24Sub = bw.day24h === undefined ? 'collecting'
    : bw.day24hComplete ? 'rolling 24h' : `${Math.round((bw.day24hSpanSeconds ?? 0) / 3600)}h so far`
  const shareVal = dv.producedSharePercent !== undefined ? `${dv.producedSharePercent}%` : '—'
  const blockOk = d.chain?.ok === true
  const blockVal = blockOk ? num(d.chain.currentBlock) : (d.chain?.ok === false ? 'Unreachable' : '—')

  return [
    tile(10, '🏆', 'Blocks won', blocksWon !== undefined ? num(blocksWon) : '—', blocksWon === undefined ? 'none observed' : null, blocksWon === undefined ? 'sub' : '', '--acc-producer'),
    tile(20, '🏅', 'Network rank', rankVal, rankSub, rankVal === '—' ? 'sub' : '', '--acc-network'),
    tile(30, '🕐', 'Last 24h', last24 !== undefined ? num(last24) : '—', last24Sub, last24 === undefined ? 'sub' : '', '--acc-race'),
    tile(40, '🥧', 'Observed share', shareVal, shareVal === '—' ? null : 'of scanned blocks', shareVal === '—' ? 'sub' : '', '--acc-network'),
    tile(45, '⛓️', 'Current block', blockVal, blockOk ? 'current' : null, blockOk ? '' : 'bad', '--acc-chain'),
  ].join('')
}

function render(d) {
  const failed = false
  const state = headerState(d, failed)
  setStatusPill(state)
  $('net').textContent = d.chain?.ok ? `${d.chain.networkName} · chain ${d.chain.chainId.slice(0, 10)}…` : 'chain unreachable'

  const deviceEl = $('device')
  const deviceLabel = d.system?.hostname || d.node?.host?.hostname
  if (deviceLabel) { deviceEl.textContent = deviceLabel; deviceEl.hidden = false } else { deviceEl.hidden = true }

  const addrEl = $('hdraddr')
  const rewardAddr = d.chain?.balances?.reward?.address
  if (rewardAddr) { addrEl.textContent = shortAddr(rewardAddr); addrEl.title = rewardAddr; addrEl.hidden = false } else { addrEl.hidden = true }

  const updatedEl = $('updated')
  if (d.generatedAt) { updatedEl.textContent = `updated ${new Date(d.generatedAt).toLocaleTimeString()}`; updatedEl.hidden = false } else { updatedEl.hidden = true }

  // Build identity in the header, beside the mark. Hidden until there is one to
  // show, so an older dashboard that reports no build does not render an empty
  // badge next to a logo.
  const brand = $('brand')
  $('brandmark').innerHTML = MARK_OXYON.replace('width="12" height="12"', 'width="17" height="17"')
  if (d.build?.version) {
    const buildEl = $('build')
    buildEl.textContent = d.build.commit && d.build.commit !== 'unknown'
      ? `${d.build.version} · ${d.build.commit}`
      : d.build.version
    // Points at the commit when there is one to point at, the repository
    // otherwise. Never at a hash that is not there to be read.
    buildEl.href = d.build.commitUrl ?? d.build.source ?? '#'
    brand.title = d.build.builtAt && d.build.builtAt !== 'unknown'
      ? `build ${d.build.version} · ${d.build.commit} · built ${new Date(d.build.builtAt).toLocaleString()}`
      : `build ${d.build.version}`
    brand.hidden = false
  } else {
    brand.hidden = true
  }

  // Cards sort themselves into one of four topic groups as they are built,
  // rather than being pushed into one flat list and re-sorted afterward by
  // matching regexes against their own rendered <h2> text. Simpler, and there
  // is nothing to keep in sync between where a card is written and where it
  // appears — it appears wherever it was pushed.
  const groups = { performance: [], network: [], production: [], analytics: [] }
  let bannerHtml = ''
  let logHtml = ''
  const dv = d.derived ?? {}

  // The one thing that explains a healthy node producing nothing. Loud, at the
  // top, in its own banner, outside every group — it is the answer to the
  // question everything else on this page raises but cannot settle.
  if (d.node?.eligibility?.blocked && !d.node?.eligibilityIgnored) {
    bannerHtml = `<section class="card-full" style="--c: var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,transparent)">
      <h2><span class="ico" aria-hidden="true">⛔</span>Producer cannot produce</h2>
      <div class="big bad">${esc(d.node.eligibility.reason)}</div>
      <div class="sub">the node said so itself, within the last ${esc(d.node.eligibility.window)}</div>
      <div class="banner">Every other signal here can read perfectly healthy while this is true.
        The container runs, the health probe passes, the chain is reachable — and no block this node
        builds will be accepted.</div>
    </section>`
  }

  // Producer
  const c = d.node?.container
  const healthClass = d.health?.ok ? 'ok' : 'bad'
  groups.performance.push(`<section class="card-lg" style="--c: var(--acc-producer); --mo:60">
    <h2><span class="ico" aria-hidden="true">⚙️</span>Producer</h2>
    <div class="big ${healthClass}">${d.health?.ok ? 'Live' : 'Not responding'}</div>
    <div class="sub">/livez on ${esc(d.health?.endpoint ?? '')}</div>
    ${dl([
      ['Container', c ? `<span class="${c.running ? 'ok' : 'bad'}">${esc(c.state ?? '—')}</span>` : '—'],
      c && ['Container uptime', esc(c.uptime ?? '—')],
      c && ['Restarts', `${num(c.restartCount)}${c.restartCount > 3 ? ' <span class="warn">⚠</span>' : ''}`],
      c && ['Image', `<span class="mono">${esc(c.image ?? '—')}</span>`],
      dv.producedObserved !== undefined && ['Blocks produced',
        `<span class="${dv.producedObserved > 0 ? 'ok' : ''}">${num(dv.producedObserved)}</span>`
        + (dv.producedSince !== undefined ? ` <span class="sub">since #${num(dv.producedSince)}</span>` : '')],
      dv.producedSharePercent !== undefined && ['Share of chain', `${dv.producedSharePercent}% ${info('This node’s blocks as a percentage of all blocks this dashboard has scanned, not of the whole chain’s history.')}`],
      dv.lastBlock !== undefined && ['Last produced', dv.lastBlockUrl
        ? `<a href="${esc(dv.lastBlockUrl)}" target="_blank" rel="noopener noreferrer">#${num(dv.lastBlock)}</a>`
        : `#${num(dv.lastBlock)}`],
      dv.blocksSinceLast !== undefined && ['Last win', dv.blocksSinceLast === 0
        ? '<span class="ok">this block</span>'
        : `${num(dv.blocksSinceLast)} block${dv.blocksSinceLast === 1 ? '' : 's'} ago`],
      dv.lastBlock === undefined && dv.producedObserved === 0 &&
        ['Last produced', '<span class="sub">none in the observed range</span>'],
      dv.productionError && ['Block scan', `<span class="warn">${esc(dv.productionError)}</span>`],
      d.node?.errorCount !== undefined && ['Log errors', d.node.errorCount > 0
        ? `<span class="warn">${num(d.node.errorCount)} error${d.node.errorCount === 1 ? '' : 's'}</span>`
        : '<span class="ok">none</span>'],
      d.node?.eligibility && ['Eligibility', d.node.eligibility.blocked
        ? (d.node.eligibilityIgnored
            ? `<span class="sub">${esc(d.node.eligibility.reason)}</span> <span class="ok">· ${esc(d.node.eligibilityNote ?? 'not enforced here')}</span>`
            : `<span class="bad">${esc(d.node.eligibility.reason)}</span>`)
        : `<span class="ok">no complaint in ${esc(d.node.eligibility.window)}</span>`],
    ])}
    ${tiles([
      // Rate, not total. These lived in Rewards, three cards down, which meant
      // the question this card exists to answer — how is it doing right now —
      // needed a scroll. They are about the producer, so they belong here; the
      // balance and the addresses stay with Rewards.
      ['Blocks/hr', dv.blocksPerHourNode !== undefined ? `${num(dv.blocksPerHourNode)}` : '—', 'produced by this node'],
      ['XL1/hr', dv.rewardPerHour !== undefined ? `${num(dv.rewardPerHour)}` : '—', 'observed'],
      ['XL1/day', dv.rewardPerDay !== undefined ? `${num(dv.rewardPerDay)}` : '—',
        dv.rewardPerDay !== undefined ? 'extrapolated' : `needs ${Math.max(0, 15 - Math.round((dv.observedSeconds ?? 0) / 60))}m more`],
      // Balance says how much; this says how recently. A node that stopped
      // earning an hour ago has exactly the same balance as one still earning.
      ['Last payout', dv.lastPayoutSeconds !== undefined ? dur(dv.lastPayoutSeconds) + ' ago' : '—',
        dv.lastPayoutXl1 !== undefined ? `+${num(dv.lastPayoutXl1)} XL1` : 'none seen yet'],
    ])}
    ${d.node?.ok === false ? `<div class="err" style="margin-top:8px">${esc(d.node.error)}</div>` : ''}
    ${d.node?.stale ? `<div class="err" style="margin-top:8px">collector data ${d.node.ageSeconds}s old</div>` : ''}
  </section>`)

  // Chain — pulled to the front of Network Health (and given the earliest
  // --mo in that group) because "is the chain itself reachable" is closer to
  // the header's own question than to a deep-dive metric.
  if (d.chain?.ok) {
    groups.network.push(`<section style="--c: var(--acc-chain); --mo:50">
      <h2><span class="ico" aria-hidden="true">⛓️</span>Chain</h2>
      <div class="big">${num(d.chain.currentBlock)}</div>
      <div class="sub">current block · finalized ${num(d.chain.finalizedBlock)}</div>
      ${dl([
        ['Finalization lag', `${num(d.chain.finalizationLag)} blocks ${info('Blocks produced but not yet irreversible. A rising number means finality is falling behind block production.')}`],
        ['Explorer', `<a href="${esc(d.chain.explorerUrl)}" target="_blank" rel="noopener noreferrer">open</a>`],
      ])}
      <details class="ident"><summary>Chain identity</summary>
        ${dl([
          ['Chain ID', `<span class="mono" style="word-break:break-all">${esc(d.chain.chainId)}</span>`],
          ['Matches preset', d.chain.chainIdMatchesPreset ? '<span class="ok">✓ yes</span>' : '<span class="bad">! NO</span>'],
        ])}
      </details>
      ${sparkDelta(d.history?.height, '', (total, active, intervals) =>
        `${num(total)} block(s) · ${total > 0 ? `${(dv.observedSeconds / total).toFixed(0)}s each` : 'chain idle'}`)}
      ${tiles([
        // One block time on this page, not two. This tile used to divide chain
        // height movement by however long the dashboard had been watching,
        // which after a restart is minutes -- and it sat four cards away from a
        // histogram measuring gaps between block timestamps over hours. They
        // disagreed by twenty seconds and nothing on the page said why. The
        // histogram is the better measurement (chain timestamps, larger sample,
        // survives a restart), so it wins whenever it has anything to say.
        ['Block time', d.network?.blockTime?.medianSeconds !== undefined
          ? `${d.network.blockTime.medianSeconds}s`
          : dv.secondsPerBlock ? `${dv.secondsPerBlock}s` : '—',
          d.network?.blockTime?.medianSeconds !== undefined
            ? `median of ${num(d.network.blockTime.samples)}`
            : 'while watching'],
        // Kept, and labelled for what it is: how fast the chain moved during
        // the window this dashboard has been up. That is a different question
        // from how long a block takes, and only confusing when it pretends not
        // to be.
        ['Chain rate', dv.blocksPerHourChain !== undefined ? `${num(dv.blocksPerHourChain)}/h` : '—',
          dv.observedSeconds ? `while watching ${dur(dv.observedSeconds)}` : 'blocks per hour'],
        // Age of the newest block we have seen. Climbing past a couple of block
        // times means the chain has stalled, which nothing else here would say.
        ['Head age', dv.headAgeSeconds !== undefined
          ? `<span class="${dv.headAgeSeconds > 180 ? 'warn' : ''}">${dv.headAgeSeconds}s</span>` : '—',
          `since newest block ${info('Age of the newest block this dashboard has observed. Climbing past a couple of block times usually means the chain, not this node, has stalled.')}`],
        ['Watching', dv.observedSeconds ? dur(dv.observedSeconds) : '—', `${num(dv.samples)} samples`],
      ])}
    </section>`)
  } else {
    groups.network.push(`<section style="--c: var(--acc-chain); --mo:50"><h2><span class="ico" aria-hidden="true">⛓️</span>Chain</h2><div class="big bad">Unreachable</div>
      <div class="err" style="margin-top:8px">${esc(d.chain?.error ?? 'unknown')}</div></section>`)
  }

  // Rewards
  const b = d.chain?.balances ?? {}
  // Addresses link straight into the explorer — the lookup an operator does most.
  const bw = dv.blocksByWindow
  const addrCell = (x) => x?.url
    ? `<a class="mono" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.address)}</a>`
    : `<span class="mono">${esc(x?.address)}</span>`
  if (b.reward || b.producer) {
    groups.performance.push(`<section style="--c: var(--acc-rewards); --mo:62">
      <h2><span class="ico" aria-hidden="true">💰</span>Rewards</h2>
      ${b.reward?.xl1 ? `<div class="big">${esc(b.reward.xl1)} <span style="font-size:14px;color:var(--muted)">XL1</span></div>
        <div class="sub">reward address balance</div>` : ''}
      ${dl([
        b.reward?.sinceStart && ['Since dashboard start', `${esc(b.reward.sinceStart.xl1)} XL1`],
        b.reward?.error && ['Reward lookup', `<span class="bad">${esc(b.reward.error)}</span>`],
        b.producer?.xl1 && ['Producer balance', `${esc(b.producer.xl1)} XL1`],
        dv.rewardEqualsProducer && ['Signer', `<span class="ok">✓ same as reward address</span> ${info('Whether the address collecting the block reward is the same key that signs candidates. When they differ, two separate identities are involved.')}`],
      ])}
      <details class="ident"><summary>Addresses ${b.reward ? `· ${esc(shortAddr(b.reward.address))}` : ''}</summary>
        ${dl([
          b.reward && ['Reward address', addrCell(b.reward)],
          b.producer && !dv.rewardEqualsProducer && ['Producer address', addrCell(b.producer)],
        ])}
      </details>
      <div class="sub" style="margin-top:7px" title="At step 0 the block reward is 500 XL1 and the producer share is 10%. Only accepted blocks pay — a published candidate that loses its race earns nothing.">
        Each accepted block pays <strong>~50 XL1</strong> — 10% of the 500 XL1 block reward.
      </div>
      ${bw ? tiles([
        // One cumulative total cannot tell a node earning steadily from one that
        // earned it all yesterday. The hour is withheld until the ring covers
        // most of one, rather than reporting a partial window as a whole.
        ['This hour', bw.hour !== undefined ? num(bw.hour) : '—',
          bw.hour !== undefined ? 'rolling' : `${Math.round((bw.hourCoverageSeconds ?? 0) / 60)}m observed`],
        // Rolling, not calendar. "Today" alone collapses at local midnight — it
        // reads 2 while the hour beside it reads 12 — and a producer restart
        // does the same to anything counted in-process. This survives both.
        ['24 hours', bw.day24h !== undefined ? num(bw.day24h) : '—',
          bw.day24h === undefined ? 'collecting'
            : bw.day24hComplete ? 'rolling' : `${Math.round((bw.day24hSpanSeconds ?? 0) / 3600)}h so far`],
        ['Today', num(bw.today), `since local midnight`],
        ['All time', bw.total !== undefined ? num(bw.total) : '—', 'since scanning began'],
      ]) : ''}
      ${sparkDelta(d.history?.reward, '', (total, active, intervals, max) =>
        // The chain pays ~50 XL1 per block, so each bar is a win and the count
        // of non-empty intervals is how many times this node was paid.
        total > 0
          ? `+${num(Number(total.toFixed(4)))} XL1 · ${num(active)} payout(s)`
          : `no reward movement in ${num(intervals)} intervals`)}

    </section>`)
  }

  // What it is worth — its own card now, rather than a banner buried in the
  // body of Rewards. The public page has led with this since it shipped while
  // the operator view, which is the one read every day, made you scroll past
  // two address rows to find it. It is the first question anyone asks about a
  // balance, so it gets a heading.
  //
  // Beyond what the public page shows: earnings since the dashboard's own
  // baseline, and what a single accepted block is worth. Both are meaningless
  // to a visitor — they depend on when this process last restarted — and both
  // are exactly what the operator wants.
  {
    const pr = d.price ?? {}
    const cur = (pr.currency ?? '').toUpperCase()
    const worthOf = (xl1) => Number.isFinite(xl1) && Number.isFinite(pr.value)
      ? `${cur} ${num(Number((xl1 * pr.value).toFixed(2)))}` : undefined
    const sinceXl1 = Number(String(b.reward?.sinceStart?.xl1 ?? '').replace(/,/g, ''))
    const sinceWorth = worthOf(sinceXl1)
    // The chain pays ~50 XL1 per accepted block; Rewards states that in XL1, so
    // this states the same block in the other unit rather than repeating it.
    const blockWorth = worthOf(50)

    if (pr.configured || pr.marketNote) {
      groups.performance.push(`<section style="--c: var(--acc-rewards); --mo:64">
        <h2><span class="ico" aria-hidden="true">⚖️</span>What it is worth</h2>
        ${pr.marketNote
          // The headline is about these coins, not about the token. XL1 trades;
          // a test-network balance of it is not the traded asset, and saying
          // "nothing, yet" about the token was simply false.
          ? `<div class="big sub" style="font-size:19px">not the traded asset</div>
             <div class="sub">${esc(pr.marketNote)}</div>`
          : pr.notional !== undefined
            ? `<div class="big">${esc(cur)} ${num(pr.notional)}</div>
               <div class="sub">reward balance at the tracked price</div>`
            : ''}
        ${pr.ok === false && pr.value === undefined
          ? `<div class="sub warn" style="margin-top:8px">price unavailable — ${esc(pr.error ?? 'no quote')}</div>`
          : dl([
            ['Tracked price', `${esc(cur)} ${pr.value ?? '—'}
              ${pr.change24h !== undefined ? `<span class="${pr.change24h >= 0 ? 'ok' : 'bad'}">${pr.change24h >= 0 ? '▲' : '▼'} ${Math.abs(pr.change24h)}%</span>` : ''}
              <span class="sub">${esc(pr.id ?? '')}</span>`],
            // No hypothetical conversion on a test network: server.mjs withholds
            // notional there precisely so this row cannot appear. A figure that
            // looks like money is read as money whatever the caption says.
            pr.notional !== undefined && !pr.marketNote &&
              ['Balance value', `${esc(cur)} ${num(pr.notional)}`],
            // The XL1 figure is worth showing either way; its cash conversion is not,
            // on a network whose coins are not the traded asset.
            sinceXl1 > 0 && ['Since dashboard start',
              pr.marketNote
                ? `${esc(b.reward.sinceStart.xl1)} XL1`
                : `${esc(b.reward.sinceStart.xl1)} XL1 <span class="sub">≈ ${esc(sinceWorth)}</span>`],
            // Also withheld on a test network, for the same reason as the balance.
          blockWorth && !pr.marketNote && ['Per accepted block', `~50 XL1 <span class="sub">≈ ${esc(blockWorth)}</span>`],
            // A quote that stopped updating is worse than none: it looks current.
            pr.ok === false && ['Quote', `<span class="warn">stale — ${esc(pr.error)}</span>`],
          ])}
        ${d.peers?.self ? `<div class="sub" style="margin-top:7px">
          What it buys is position: <strong>#${num(d.peers.self.rank)} of ${num(d.peers.producers)}</strong>
          producers, ${d.peers.self.sharePercent}% of the chain.</div>` : ''}
      </section>`)
    }
  }

  // Alerts — read from the alerter's own state file, never evaluated here.
  {
    const al = d.alerts ?? {}
    const firing = al.active ?? []
    const big = !al.installed ? 'Not set up'
      : al.ok === false ? 'Unreadable'
      : !al.running ? 'Not running'
      : firing.length ? `${firing.length} firing`
      : 'All clear'
    const cls = !al.installed ? 'sub' : (al.ok === false || !al.running) ? 'bad' : firing.length ? 'warn' : 'ok'
    groups.network.push(`<section style="--c: var(--bad); --mo:72">
      <h2><span class="ico" aria-hidden="true">🔔</span>Alerts</h2>
      <div class="big ${cls}">${esc(big)}</div>
      <div class="sub">${al.installed
        ? `checked ${al.lastRunAgeSeconds !== undefined ? dur(al.lastRunAgeSeconds) + ' ago' : '—'}`
        : 'no alerter has written to this state directory'}</div>
      ${firing.length ? `<div style="margin-top:8px">${firing.map((a) => `<div class="alert-row">
        <span class="alert-dot warn">●</span>
        <span>${esc(a.label)}</span>
        <span class="sub">${dur(a.ageSeconds)}</span>
      </div>`).join('')}</div>` : ''}
      ${dl([
        // "Nothing is firing" and "nothing is watching" look identical on a
        // panel and mean opposite things, so the heartbeat is a row of its own.
        al.installed && ['Alerter', al.running
          ? '<span class="ok">running</span>'
          : `<span class="bad">silent for ${dur(al.lastRunAgeSeconds ?? 0)}</span>`],
        al.installed && !firing.length && al.running && ['Conditions', '<span class="ok">none firing</span>'],
        // Configured and firing are different questions, and on a machine with
        // every channel left blank only one of them has an answer -- an alerter
        // with nowhere to send writes an empty state file on every run and is
        // indistinguishable from a quiet, healthy node.
        al.armed && ['Channels', al.armed.channels?.length
          ? `<span class="ok">${al.armed.channels.map(esc).join(', ')}</span>`
          : '<span class="bad">none — nothing is delivered anywhere</span>'],
        // Its own row, and warned about rather than merely reported. Every other
        // channel can only report problems this machine is awake to observe;
        // this is the one that covers it ceasing to exist, where the signal is
        // the absence of a signal.
        al.armed && ['Dead-man switch', al.armed.deadman
          ? '<span class="ok">armed</span>'
          : '<span class="warn">not configured</span>'],
        al.malformed > 0 && ['Unreadable lines', `<span class="warn">${num(al.malformed)}</span>`],
        al.error && ['Error', `<span class="bad">${esc(al.error)}</span>`],
      ])}
      ${al.armed && !al.armed.deadman ? `<div class="banner">Nothing here can tell you this machine has stopped existing.
        A power cut, a dead disk, a host that never came back from a reboot — each sends exactly what a healthy node sends.
        Point <span class="mono">XL1_ALERT_DEADMAN_URL</span> at a healthchecks.io or Uptime Kuma push monitor and the
        absence of a ping becomes the alarm.</div>` : ''}
      ${!al.installed ? `<div class="banner">The dashboard only reads what the alerter writes; it never sends anything itself.
        Set a channel in <span class="mono">alert.env</span> and the alerter will start writing here.</div>` : ''}
    </section>`)
  }

  // XL1 Network — the chain, not this node.
  {
    const nw = d.network ?? {}
    const co = nw.concentration
    const ob = nw.observed ?? {}
    const bt = nw.blockTime ?? {}
    if (co) {
      // How far the leader sits above an even split. The single number that
      // says whether production is spread or captured.
      const skew = co.evenShare > 0 ? co.leaderShare / co.evenShare : undefined
      const leaderRow = (d.peers?.top ?? []).find((r) => r.sharePercent === co.leaderShare)
      const topRows = (d.peers?.top ?? []).slice(0, 10)
      groups.network.push(`<section class="card-lg" style="--c: var(--acc-network); --mo:70">
        <h2><span class="ico" aria-hidden="true">🌐</span>XL1 Network</h2>
        <div class="big">${num(co.producers)}</div>
        <div class="sub">producers seen across ${num(ob.blocks)} observed blocks</div>
        ${dl([
          ['Nakamoto coefficient',
            `<span class="${co.nakamoto <= 2 ? 'bad' : co.nakamoto <= 3 ? 'warn' : 'ok'}">${num(co.nakamoto)}</span>`
            + ` <span class="sub">of ${num(co.producers)}</span> ${info('The fewest producers whose combined observed output passes 50%. Higher is more decentralised; 1 means a single producer could dictate the chain.')}`],
          ['Top producer', `${co.leaderShare}%`
            + (leaderRow?.label ? ` <span class="sub">${esc(leaderRow.label)}</span>` : '')
            + (skew ? ` <span class="sub">· ${skew.toFixed(1)}× an even split</span> ${info('How far the leader’s share sits above what an equal split among all producers would be. 1.0× is perfectly even.')}` : '')],
          ['Top 3 combined', `${co.top3Share}% ${info('Share held by the three largest producers together — a second view of concentration that one leader’s share alone can hide.')}`],
          ['Even split would be', `<span class="sub">${co.evenShare}% each</span>`],
          co.nakamoto67 !== undefined && ['To reach 67%', `${num(co.nakamoto67)} producers ${info('The fewest producers whose combined share passes two-thirds — the threshold needed to finalize under XL1’s consensus rule, not just outvote at 50%.')}`],
          bt.meanSeconds !== undefined && ['Block time',
            `${bt.meanSeconds}s mean <span class="sub">· ${bt.medianSeconds}s median</span>`],
          d.network?.selfShare !== undefined && ['This node', `${d.network.selfShare}%`],
        ])}
        ${co.producers > 0 ? `<div class="conc-bar" title="Observed share, largest producer first">${
          topRows.map((r, i) => `<i class="${i < (co.nakamoto ?? 0) ? 'nk' : ''}" style="width:${Math.max(0.5, r.sharePercent ?? 0)}%${
            r.isSelf ? ';background:var(--ok)' : ''}" title="${esc(r.label ?? shortAddr(r.address))} — ${r.sharePercent}%"></i>`).join('')
        }</div><div class="sub" style="margin-top:4px"><span class="ok">green is this node</span> · outlined segments are counted toward the Nakamoto coefficient</div>` : ''}
        <div class="banner">Observed by this dashboard over blocks ${num(ob.fromBlock)}–${num(ob.toBlock)}, not a
          protocol-wide census. A producer that never appeared in that window is not counted.</div>
      </section>`)
    }
  }

  // Block time — the distribution, not just the average.
  {
    const bt = d.network?.blockTime
    if (bt && bt.samples > 0) {
      const max = Math.max(1, ...bt.buckets)
      // Only the occupied span, so an empty tail does not squash the shape.
      let lo = bt.buckets.findIndex((c) => c > 0)
      let hi = bt.buckets.length - 1
      while (hi > lo && bt.buckets[hi] === 0) hi--
      const shown = []
      for (let i = lo; i <= hi; i++) shown.push([bt.edges[i], bt.buckets[i], bt.edges[i + 1]])
      const pct = (n) => ((n / bt.samples) * 100)
      // Percentile ticks positioned on the same seconds axis as the bars —
      // an overlay, not a second chart.
      const axisLo = shown[0]?.[0] ?? 0
      const axisHi = shown[shown.length - 1]?.[2] ?? (axisLo + 1)
      const tickPct = (sec) => Math.max(0, Math.min(100, ((sec - axisLo) / Math.max(1, axisHi - axisLo)) * 100))
      const ticks = [
        bt.p95Seconds !== undefined && ['P95', bt.p95Seconds],
        bt.p99Seconds !== undefined && ['P99', bt.p99Seconds],
      ].filter(Boolean)
      groups.analytics.push(`<section class="card-lg" style="--c: var(--acc-analytics); --mo:100">
        <h2><span class="ico" aria-hidden="true">⏱️</span>Block time</h2>
        <div class="big">${bt.medianSeconds}s</div>
        <div class="sub">median over ${num(bt.samples)} observed intervals</div>
        <div class="hist-wrap">
          <div class="hist">${shown.map(([edge, count, next]) => `
            <div class="hist-col" title="${edge}–${next ?? '∞'}s · ${num(count)} blocks · ${pct(count).toFixed(1)}%">
              <div class="hist-bar" style="height:${count === 0 ? 0 : Math.max(2, (count / max) * 100)}%"></div>
              <div class="hist-x">${edge}</div>
            </div>`).join('')}</div>
          ${ticks.map(([label, sec]) => `<div class="hist-tick" style="left:${tickPct(sec).toFixed(1)}%"><span>${label}</span></div>`).join('')}
        </div>
        <div class="sub" style="text-align:center;margin-top:-2px">seconds between consecutive blocks</div>
        ${dl([
          ['Mean', `${bt.meanSeconds}s`],
          ['Median', `${bt.medianSeconds}s`],
          ['P95', `<span title="95% of observed intervals were at or below this. Read as a floor: it is the bucket edge, not a decimal.">≥ ${bt.p95Seconds}s ⓘ</span>`],
          ['P99', `≥ ${bt.p99Seconds}s ${info('99% of observed intervals were at or below this — the worst-case tail floor.')}`],
          ['Fastest / slowest', `${bt.minSeconds}s / ${bt.maxSeconds}s`],
          // Refusals are shown rather than swallowed: the shape is the point,
          // and a histogram quietly dropping a third of its input is a lie.
          (bt.rejected?.nonConsecutive > 0 || bt.rejected?.nonPositive > 0) && ['Not measured',
            `<span class="sub">${num(bt.rejected.nonConsecutive)} across scan gaps${
              bt.rejected.nonPositive > 0 ? `, ${num(bt.rejected.nonPositive)} out of order` : ''}</span>`],
        ])}
      </section>`)
    }
  }

  // Continuity — ported from the public page, which has had it since launch.
  // The operator view never did; it is the same field, just newly shown here.
  {
    const cont = d.continuity
    if (cont?.producingPercent !== undefined) {
      const hrs = cont.hours ?? []
      const max = Math.max(1, ...hrs.map((h) => h.wins ?? 0))
      groups.analytics.push(`<section class="card-lg" style="--c: var(--acc-analytics); --mo:108">
        <h2><span class="ico" aria-hidden="true">🕓</span>Continuity</h2>
        <div class="big">${cont.producingPercent}<span class="sub" style="font-size:16px">%</span></div>
        <div class="sub">of the ${num(cont.observedHours)} hours observed had at least one block won</div>
        <div class="hist acc-green" style="height:56px">${hrs.slice(-72).map((h) => `
          <div class="hist-col" title="${esc(new Date(h.t).toLocaleString())} — ${h.observed ? `${h.wins ?? 0} won of ${h.chainBlocks ?? 0}` : 'not observed'}">
            <div class="hist-bar" style="height:${h.observed ? Math.max(3, ((h.wins ?? 0) / max) * 100) : 0}%;${
              h.observed ? '' : 'background:var(--line)'}"></div>
          </div>`).join('')}</div>
        <div class="sub" style="text-align:center">last 72 hours · a flat grey column is an hour nobody was watching</div>
        ${dl([
          ['Hours producing', num(cont.producingHours)],
          ['Hours with none', `${num(cont.missedHours)} <span class="sub">while the chain moved</span>`],
          cont.longestMissedHours > 0 && ['Longest gap', `${num(cont.longestMissedHours)} h`],
          cont.unobservedHours > 0 && ['Not observed', `${num(cont.unobservedHours)} h <span class="sub">dashboard was down</span>`],
        ])}
      </section>`)
    }
  }

  // Producer movement — who is gaining, who has gone quiet.
  {
    const nw = d.network ?? {}
    const dr = nw.drift
    const ch = nw.churn
    if (dr || ch) {
      const movers = (dr?.rows ?? []).filter((r) => r.deltaPercent !== undefined && Math.abs(r.deltaPercent) >= 0.5)
      const up = movers.filter((r) => r.deltaPercent > 0).slice(0, 4)
      const down = movers.filter((r) => r.deltaPercent < 0).slice(-4).reverse()
      const name = (r) => esc(r.label ?? shortAddr(r.address))
      const row = (r) => `<div class="drift-row">
        <span class="${r.deltaPercent > 0 ? 'ok' : 'bad'}">${r.deltaPercent > 0 ? '▲' : '▼'} ${Math.abs(r.deltaPercent).toFixed(2)} pts</span>
        <span>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${name(r)}</a>` : name(r)}</span>
        <span class="sub">${r.previousSharePercent ?? '—'}% → ${r.sharePercent ?? '—'}%</span>
      </div>`
      groups.analytics.push(`<section style="--c: var(--acc-analytics); --mo:102">
        <h2><span class="ico" aria-hidden="true">🔀</span>Producer movement</h2>
        <div class="big">${num(ch?.seenThisWeek)}</div>
        <div class="sub">producing in the last 7 days · ${num(ch?.seenToday)} today</div>
        ${dr?.comparable === false
          ? `<div class="banner">Share drift needs two full weeks of day buckets to compare.
              ${num(dr.daysWithData)} day(s) recorded so far — the comparison appears once there is something honest to compare.</div>`
          : `${up.length || down.length
              ? `<div class="sub" style="margin-top:10px">7-day share vs the week before ${info('This week’s share of observed blocks minus last week’s. Points, not percent-of-percent.')}</div>
                 ${up.map(row).join('')}${down.map(row).join('')}`
              : '<div class="sub" style="margin-top:10px">no producer moved more than half a point this week</div>'}`}
        ${dl([
          ch?.arrived?.length && ['Newly observed',
            ch.arrived.map((a) => `<span title="first seen ${esc(a.firstSeen ?? '')}">${esc(a.label ?? shortAddr(a.address))}</span>`).join(', ')],
          ch?.quiet?.length && ['Gone quiet',
            ch.quiet.map((a) => `<span class="warn" title="last seen ${esc(a.lastSeen ?? '')}">${esc(a.label ?? shortAddr(a.address))}</span>`).join(', ')],
          // Absent lists and unanswerable ones look identical otherwise, and
          // only one of them means the chain has been steady.
          ch?.comparable === false && ['Arrivals', '<span class="sub">needs a week of history before this one</span>'],
          ch?.comparable && !ch.arrived.length && !ch.quiet.length
            && ['Arrivals', '<span class="ok">nobody new, nobody gone quiet</span>'],
          ch && ['Day buckets', `${num(ch.daysStored)} of ${num(nw.observed?.daysKept)} kept`],
        ])}
        ${ch?.quiet?.length ? `<div class="sub" style="margin-top:8px">"Quiet" means not observed in ${num(ch.quietAfterDays)} days —
          this dashboard sees one window of one chain, which is enough to say when a producer was last seen and not enough to say it has stopped.</div>` : ''}
      </section>`)
    }
  }

  // Fleet — every node you run, on one page. Absent entirely unless configured.
  {
    const fl = d.fleet
    if (fl) {
      const dot = (n) => !n.ok ? 'bad'
        : n.status === 'down' ? 'bad' : n.status === 'degraded' ? 'warn' : 'ok'
      const row = (n) => `<tr${n.isSelf ? ' class="self"' : ''}>
        <td><span class="alert-dot ${dot(n)}">●</span> ${esc(n.label)}${n.isSelf ? ' <span class="you-badge">YOU</span>' : ''}</td>
        <td>${n.ok
          ? `<span class="${n.status === 'ok' ? 'ok' : n.status === 'down' ? 'bad' : 'warn'}">${esc(n.status)}</span>`
          : `<span class="bad">unreachable</span>`}</td>
        <td>${n.blocksTotal !== undefined ? num(n.blocksTotal) : '—'}</td>
        <td>${n.sharePercent !== undefined ? n.sharePercent + '%' : '—'}</td>
        <td>${n.rank !== undefined ? '#' + num(n.rank) + (n.producers ? ' of ' + num(n.producers) : '') : '—'}</td>
        <td>${n.alertsFiring
          ? `<span class="warn">${num(n.alertsFiring)}</span>`
          : n.alerterRunning === false ? '<span class="bad">alerter down</span>'
          : n.alerterRunning === undefined ? '<span class="sub">—</span>' : '<span class="ok">clear</span>'}</td>
        <td class="sub">${n.ok
          ? esc(n.version ?? '—')
          : esc((n.error ?? 'no answer') + (n.lastSeenAt ? ' · last seen ' + new Date(n.lastSeenAt).toLocaleTimeString() : ''))}</td>
      </tr>`
      groups.analytics.push(`<section class="card-full" style="--c: var(--acc-analytics); --mo:104">
        <h2><span class="ico" aria-hidden="true">🛰️</span>Fleet</h2>
        <div class="big ${fl.reachable === fl.total ? 'ok' : 'warn'}">${num(fl.reachable)}<span class="sub" style="font-size:16px"> of ${num(fl.total)}</span></div>
        <div class="sub">nodes answering${fl.combinedBlocks !== undefined
          ? ` · ${num(fl.combinedBlocks)} block(s) between ${num(fl.combinedFrom)} of them` : ''}</div>
        <table class="board">
          <thead><tr><th>Node</th><th>State</th><th>Blocks</th><th>Share</th><th>Rank</th><th>Alerts</th><th>Build</th></tr></thead>
          <tbody>${fl.nodes.map(row).join('')}</tbody>
        </table>
        ${fl.combinedSharePercent !== undefined
          ? `<div class="sub">combined share of the chain: ${fl.combinedSharePercent}%</div>`
          : `<div class="sub">No combined share: each node scans its own window, and shares only add up when
              they cover the same blocks. The block counts above are each node's own tally.</div>`}
        ${fl.rejected?.length ? `<div class="sub warn">ignored: ${fl.rejected.map(esc).join('; ')}</div>` : ''}
        <div class="sub">peers polled every ${num(fl.pollSeconds)}s · each is another dashboard, never the chain</div>
      </section>`)
    }
  }

  // Operations — score, bottleneck, competition. All arithmetic over data that
  // is already in this payload; the card issues no request of its own.
  //
  // First in this group, and full width: it is the one synthesized "how are we
  // doing" number the other three cards each explain a piece of, so it reads
  // before them, not beside a much shorter one. Sharing a row with Software &
  // host at half this card's height left a slab of empty space under the
  // shorter card every time -- full width removes the mismatch instead of
  // trying to out-guess it.
  const ops = dv.operations
  if (ops && (ops.score !== undefined || ops.bottleneck)) {
    // Confidence is shown wherever a number could be read as more solid than it
    // is. A percentile over 19 samples and one over 13,000 look identical
    // otherwise, and only one of them is worth acting on.
    const conf = (n, warm = 30, high = 300) => {
      if (!Number.isFinite(n)) return ''
      const label = n >= high ? `high confidence · ${num(n)}` : n >= warm ? `limited · ${num(n)}` : `warming up · ${num(n)}`
      return `<span class="conf" title="calculated from ${num(n)} samples">${label}</span>`
    }
    const cls = (v) => (v >= 75 ? '' : v >= 50 ? 'mid' : 'low')

    const comp = ops.competition
    groups.production.push(`<section class="card-full" style="--c: var(--acc-ops); --mo:80">
      <h2><span class="ico" aria-hidden="true">🎯</span>Operations</h2>
      ${ops.score !== undefined
        ? `<div class="big">${num(ops.score)} <span style="font-size:14px;color:var(--muted)">/ 100</span></div>
           <div class="sub" title="The mean of whichever components could be measured. A component with no data is left out rather than scored zero.">mean of ${num(ops.components.length)} measured component(s)</div>
           ${ops.components.map((c) => `<div class="score-row" title="${esc(c.why)}">
              <span class="sub">${esc(c.label)}</span><span class="mono">${num(c.value)}</span>
              <span class="score-bar ${cls(c.value)}"><i style="width:${Math.max(2, c.value)}%"></i></span>
            </div>`).join('')}`
        : '<div class="sub">Not enough measured components for a score yet.</div>'}

      ${ops.bottleneck ? `<div class="sub" style="margin-top:10px">Bottleneck</div>
        <div class="${ops.bottleneck.key === 'none' ? 'ok' : ops.bottleneck.key === 'unknown' ? 'sub' : 'warn'}">
          ${ops.bottleneck.key === 'none' ? '✓ ' : ops.bottleneck.key === 'unknown' ? '' : '! '}${esc(ops.bottleneck.text)}
        </div>` : ''}

      ${comp ? `<div class="sub" style="margin-top:10px">Field of ${num(comp.producers)}</div>
        ${dl([
          ['Our share', Number.isFinite(comp.ourShare) ? `${comp.ourShare}%` : '—'],
          ['Leader', `${comp.leaderShare}%`],
          ['Top 3 combined', `${comp.topThreeShare}%`],
          ['vs median', Number.isFinite(comp.vsMedian)
            ? `<span class="${comp.vsMedian >= 0 ? 'ok' : 'warn'}">${comp.vsMedian >= 0 ? '↑' : '↓'} ${Math.abs(comp.vsMedian)} pts</span> ${info('This node’s share compared to the field’s median producer, in percentage points.')}` : '—'],
          ['vs leader', Number.isFinite(comp.vsLeader) ? `${comp.vsLeader} pts ${info('This node’s share compared to the current leader, in percentage points.')}` : '—'],
        ])}` : ''}

      ${(ops.sinceWin !== undefined || ops.longestGap !== undefined) ? tiles([
        ['Since last win', ops.sinceWin !== undefined ? `${num(ops.sinceWin)}` : '—', 'blocks'],
        ['Longest gap', ops.longestGap !== undefined ? `${num(ops.longestGap)}` : '—', `in last ${num(ops.ringBlocks)}`],
      ]) : ''}

      ${ops.stages ? `<div class="sub" style="margin-top:10px">Where a cycle spends its time ${conf(dv.latency?.samples)}</div>
        ${(() => {
          const rows = Object.entries(ops.stages).filter(([, v]) => Number.isFinite(v))
          const top = Math.max(...rows.map(([, v]) => v), 1)
          const names = { headFetch: 'head fetch', blockProduction: 'build', mempoolTx: 'mempool tx', mempoolBlocks: 'mempool blocks', submit: 'submit' }
          return rows.sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="lat-row">
            <span class="sub">${esc(names[k] ?? k)}</span><span class="mono">${num(v)} ms</span>
            <span class="lat-bar"><i style="width:${Math.max(2, (v / top) * 100)}%"></i></span>
          </div>`).join('')
        })()}
        <div class="sub" style="margin-top:5px"
          title="These nest: a cycle contains the head fetch and the build, and the build contains the mempool calls. They are durations, not a waterfall, and do not sum to the cycle.">
          p50 per stage · nested, not a waterfall</div>` : ''}
    </section>`)
  }

  // Trends — days, not minutes. The in-memory sparklines above reset with the
  // container; this survives, which is the only way to answer "did it earn
  // anything last week".
  const tr = d.trend
  if (tr && (tr.daily?.length || tr.error)) {
    const days = tr.daily ?? []
    const recent = days.slice(-14)
    const maxB = Math.max(1, ...recent.map((x) => x.blocks))
    const maxE = Math.max(1, ...recent.map((x) => x.earned))
    const totalB = days.reduce((a, x) => a + x.blocks, 0)
    const totalE = days.reduce((a, x) => a + x.earned, 0)
    // Thicker bars with the number under each one. A bar chart with no scale is
    // a shape; the value is what makes it a measurement. Only the last few days
    // are labelled when the window is long, so the labels never collide.
    const bars = (vals, max, fmt = (n) => num(n), cls = '') => {
      const label = vals.length <= 10
      return `<div class="trendbars ${cls}">${vals.map((v) => `
        <div class="trendbar" title="${esc(v.day)}: ${fmt(v.n)}">
          <div class="trendbar-fill" style="height:${Math.max(3, (v.n / max) * 100)}%"></div>
          ${label ? `<div class="trendbar-n">${fmt(v.n)}</div>` : ''}
        </div>`).join('')}</div>`
    }

    // Nothing recorded yet is not zero blocks and a peak of one. Say what is
    // actually true — that it has not been running long enough — rather than
    // charting placeholders that read as a node which earned nothing.
    const empty = days.length === 0
    groups.performance.push(`<section style="--c: var(--acc-analytics); --mo:66">
      <h2><span class="ico" aria-hidden="true">📈</span>Trends</h2>
      ${tr.error ? `<div class="err">${esc(tr.error)}</div>` : ''}
      ${empty ? `
        <div class="big sub" style="font-size:16px">collecting…</div>
        <div class="sub">One sample every 5 minutes. The first full day appears tomorrow;
          history survives restarts once the store is writable.</div>
      ` : `
        <div class="big">${num(totalB)}</div>
        <div class="sub">blocks over ${num(days.length)} day(s) · ${num(tr.points)} samples</div>
        ${bars(recent.map((x) => ({ day: x.day, n: x.blocks })), maxB, undefined, 'acc-green')}
        <div class="sparkfoot"><span>blocks/day</span><span>best ${num(maxB)} · avg ${num(Math.round(totalB / days.length))}</span></div>
        ${bars(recent.map((x) => ({ day: x.day, n: x.earned })), maxE, (n) => num(Math.round(n)), 'acc-gold')}
        <div class="sparkfoot"><span>XL1/day</span><span>best ${num(Math.round(maxE))} · avg ${num(Math.round(totalE / days.length))}</span></div>
        ${tiles([
          ['Earned', num(Number(totalE.toFixed(2))), `over ${num(days.length)}d`],
          ['Best day', num(maxB), 'blocks'],
          ['Avg/day', num(Number((totalB / days.length).toFixed(1))), 'blocks'],
          ['Retained', `${num(tr.retainDays)}d`, 'rolling window'],
        ])}
      `}
    </section>`)
  }

  // System
  const s = d.system
  if (s?.ok) {
    const t = s.throttle
    // Headroom, not throttle state. The soft limit is raised to 70 °C at
    // provision time and the hard limit is 85 °C, so 65 °C was amber for a
    // machine that was working exactly as configured.
    const tempCls = s.cpuTempC >= 80 ? 'bad' : s.cpuTempC >= 75 ? 'warn' : 'ok'
    // The headline is whatever this machine can actually measure. A Pi throttles
    // on heat, so temperature is the number that matters and it has a sensor for
    // it. Windows exposes no CPU temperature without vendor drivers and has no
    // load average at all, so printing "—°C" and "load undefined" was the card
    // describing a Pi it was not running on.
    const hasTemp = Number.isFinite(s.cpuTempC)
    const hasLoad = Array.isArray(s.loadAverage) && s.loadAverage.length > 0
    const headline = hasTemp
      ? `<div class="big ${tempCls}">${s.cpuTempC}°C</div><div class="sub">CPU temperature</div>`
      : Number.isFinite(s.cpuPercent)
        ? `<div class="big">${s.cpuPercent}<span style="font-size:14px;color:var(--muted)">% CPU</span></div>
           <div class="sub">across ${num(s.cpuCount)} cores</div>`
        : `<div class="big">${s.memory.usedPercent}<span style="font-size:14px;color:var(--muted)">% RAM</span></div>
           <div class="sub">memory in use</div>`
