# Installed to /etc/systemd/journald.conf.d/99-xl1-persistent.conf
#
# Keep the journal across reboots.
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# (from raspberrypi-sys-mods) which sets Storage=volatile to spare the SD card.
# The effect is invisible until you need it: /var/log/journal exists, is empty,
# and journald writes to /run/log/journal, so every log dies at reboot and it
# looks like journald is merely misconfigured rather than deliberately
# overridden. `systemd-analyze cat-config systemd/journald.conf` is what shows
# the truth.
#
# Drop-ins merge by filename across every directory and the LAST name wins, so
# this file must sort after 40-. A first attempt named 10- was silently beaten.
#
# The caps are the honest half of the trade: the vendor's SD-card concern is
# real, so this bounds the journal rather than pretending the concern was wrong.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
SystemKeepFree=500M
MaxRetentionSec=2week
