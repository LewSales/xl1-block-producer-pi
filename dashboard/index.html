    groups.analytics.push(`<section style="--c: var(--acc-analytics); --mo:106">
      <h2><span class="ico" aria-hidden="true">${s.platform === 'windows' ? '🖥️' : '🍓'}</span>${s.platform === 'windows' ? 'Host' : 'Raspberry Pi'}</h2>
      ${s.hostUnavailable ? `<div class="big sub" style="font-size:16px">not reported</div>
        <div class="sub">${esc(s.hostUnavailableReason ?? 'host metrics unavailable')} — this dashboard runs in a
        container whose own memory and disk describe the Docker VM, not this machine, so nothing is shown rather
        than something that would look like a measurement.</div>` : ''}
      ${headline}
      <div class="sub">${esc(s.hostname)} · up ${dur(s.uptimeSeconds)}${hasLoad ? ` · load ${s.loadAverage.join(' ')}` : ''}</div>
      ${hasTemp ? spark(d.history?.tempC) : ''}
      ${tiles([
        ['RAM', `${s.memory.usedPercent}%`, `${bytes(s.memory.totalBytes - s.memory.availableBytes)} of ${bytes(s.memory.totalBytes)}`],
        s.swap?.totalBytes > 0 && ['Swap', `${s.swap.usedPercent}%`, `${bytes(s.swap.usedBytes)} of ${bytes(s.swap.totalBytes)}`],
        s.disk && ['Disk', `${s.disk.usedPercent}%`, `${bytes(s.disk.freeBytes)} free`],
        s.cpuPercent !== undefined
          ? ['CPU', `${s.cpuPercent}%`, `${s.cpuCount} cores`]
          : ['Load', `${s.loadAverage?.[0] ?? '—'}`, `${s.cpuCount} cores`],
        t && ['Power', t.undervoltageNow ? '<span class="bad">LOW</span>' : t.undervoltageSinceBoot ? '<span class="warn">dipped</span>' : '<span class="ok">stable</span>',
              t.undervoltageNow ? 'undervolting now' : t.undervoltageSinceBoot ? 'since boot' : '5V holding'],
        // Both limits, not just the hard one. Reading bits 2/18 alone showed
        // "none" in green on a Pi whose soft limit had been clocking it from
        // 1.4 GHz to 1.2 GHz — the gentler limit is the one a 3 B+ actually
        // hits, so the tile was silent about the only throttling that happens.
        t && ['Throttle',
              t.throttledNow ? '<span class="bad">HARD</span>'
              : t.softTempLimitNow ? '<span class="bad">HEAT</span>'
              : (t.throttledSinceBoot || t.softTempLimitSinceBoot) ? '<span class="warn">earlier</span>'
              : '<span class="ok">none</span>',
              t.throttledNow ? '85°C limit reached'
              : t.softTempLimitNow ? 'clocked down to 1.2 GHz'
              : t.throttledSinceBoot ? '85°C limit, since boot'
              : t.softTempLimitSinceBoot ? 'heat, since boot'
              : 'full clock'],
      ])}
      ${bar(s.memory.usedPercent)}
    </section>`)
  }

  // Candidate race — why blocks are being lost, from telemetry already collected.
  //
  // The counters are mixed-source on purpose and the card says so. Losses and
  // retries are the producer's own log, the only place that records WHY a
  // candidate died. Wins are the chain scan, because "Published block" in the
  // log means submitted, not accepted — treating it as success is the bug that
  // once had this dashboard reporting zero blocks for a node producing several
  // every ten minutes.
  const race = dv.race
  if (race && (race.built !== undefined || race.chainBlocks)) {
    const mins = (sec) => (sec >= 3600 ? `${(sec / 3600).toFixed(1)}h` : `${Math.round(sec / 60)}m`)
    // The pulse reads oldest-left. A win is taller AND accented, so the strip
    // survives greyscale and colour-blindness.
    const pulse = (race.pulse ?? []).length > 0
      ? `<div class="pulse" role="img" aria-label="${num(race.won)} of the last ${num(race.chainBlocks)} chain blocks were produced by this node">
           ${race.pulse.map((w) => `<i class="${w ? 'win' : ''}"></i>`).join('')}
         </div>
         <div class="sub">last ${num(race.chainBlocks)} chain blocks${race.chainWindowSeconds ? ` · ${mins(race.chainWindowSeconds)}` : ''} · <span class="ok">${num(race.won)} won</span></div>`
      : ''

    // A stacked bar above the itemised list — the shape of losses at a glance,
    // before reading which reason is which.
    const stack = (race.reasons ?? []).length > 0
      ? `<div class="reason-stack">${race.reasons.map((r) => `<i style="width:${Math.max(1, r.percent)}%" title="${esc(r.label)} — ${r.percent}%"></i>`).join('')}</div>`
      : ''

    // Share of losses, not of builds: the question is "when we lose, why".
    const reasons = (race.reasons ?? []).length > 0
      ? `<div class="sub" style="margin-top:10px">Why candidates lost${race.observedSeconds ? ` · last ${mins(race.observedSeconds)}` : ''}</div>`
        + stack
        + race.reasons.map((r) => `<div class="reason">
             <span>${esc(r.label)}</span><span class="mono">${num(r.count)} · ${r.percent}%</span>
             <span class="reason-bar"><i style="width:${Math.max(2, r.percent)}%"></i></span>
           </div>`).join('')
      : '<div class="sub" style="margin-top:10px">No candidates rejected in the window.</div>'

    groups.production.push(`<section style="--c: var(--acc-race); --mo:82">
      <h2><span class="ico" aria-hidden="true">⚔️</span>Candidate race</h2>
      <div class="big">${race.won !== undefined ? num(race.won) : '—'} <span style="font-size:14px;color:var(--muted)">won</span></div>
      <div class="sub" title="Wins are counted from the chain scan. A log line saying &quot;Published block&quot; means submitted, not accepted.">of ${num(race.chainBlocks)} recent blocks · chain-counted</div>
      ${pulse}
      ${tiles([
        ['Built', race.built !== undefined ? num(race.built) : '—', race.observedSeconds ? mins(race.observedSeconds) : 'log window'],
        ['Lost', race.lostTotal !== undefined ? num(race.lostTotal) : '—', 'rejected locally'],
        ['Retries', race.retries !== undefined ? num(race.retries) : '—', 'rebuilt and resubmitted'],
        // The rate the whole card is about, and the one number here that is
        // comparable between machines: wins over the chain blocks we watched.
        ['Win rate', (race.won !== undefined && race.chainBlocks)
          ? `${((race.won / race.chainBlocks) * 100).toFixed(1)}%` : '—', `of recent blocks ${info('Chain-confirmed wins over the chain blocks this dashboard watched — not builds attempted, which double-counts retries.')}`],
      ])}
      ${reasons}
    </section>`)
  }

  // Latency — the question "is it laggy?" answered without guessing.
  //
  // Every number here was already computed by the producer: ProducerActor times
  // headFetch on every check and the collector reads the snapshot off the health
  // port. No ping of our own, deliberately. A dashboard that probed the gateway
  // itself would add requests to the shared endpoint this node competes on, to
  // re-derive a figure the node had already measured on the path that matters.
  //
  // The split is the point. The floor is what the wire costs; the gap above it
  // is this machine parsing and validating what came back. One of those is
  // XYO's problem and the other is yours, and a single round-trip number cannot
  // tell you which you have.
  const lat = dv.latency
  if (lat) {
    const localPart = lat.localMs !== undefined && lat.wireFloorMs !== undefined
      ? `${num(lat.localMs)} ms of it local`
      : 'local share unknown'
    groups.production.push(`<section style="--c: var(--acc-latency); --mo:84">
      <h2><span class="ico" aria-hidden="true">📡</span>Latency</h2>
      <div class="big">${num(lat.typicalMs)} <span style="font-size:14px;color:var(--muted)">ms typical</span></div>
      <div class="sub">head fetch, ${localPart}</div>
      ${(() => {
        // Bars share one scale so the comparison is honest — the eye is being
        // asked to judge proportion, and per-row scaling would make the wire
        // floor look the same size as a 2.4s cycle.
        const rows = [
          ['wire', 'Wire', lat.wireFloorMs, 'the network itself: the fastest head fetch seen'],
          ['', 'p50', lat.typicalMs, 'half of head fetches were faster than this'],
          ['tail', 'p95', lat.p95Ms, 'the slow 5% — what a bad moment costs'],
          ['tail', 'Cycle', lat.cycleP95Ms, 'a whole production cycle at p95, budget is 1000ms'],
        ].filter(([, , v]) => Number.isFinite(v))
        const top = Math.max(...rows.map(([, , v]) => v), 1)
        return rows.map(([cls, label, v, tip]) => `<div class="lat-row" title="${esc(tip)}">
          <span class="sub">${esc(label)}</span>
          <span class="mono">${num(v)} ms</span>
          <span class="lat-bar ${cls}"><i style="width:${Math.max(2, (v / top) * 100)}%"></i></span>
        </div>`).join('')
      })()}
      ${lat.localMs !== undefined ? `<div class="sub" style="margin-top:7px"
        title="The wire floor is the fastest head fetch seen — the network. Everything above it is this machine parsing and validating the answer.">
        <strong>+${num(lat.localMs)} ms</strong> local · ${num(lat.samples)} samples</div>` : ''}
    </section>`)
  }

  // Software and host — the two layers that rot quietly while every other
  // signal on this page stays green. Last in this group, not first: it is
  // housekeeping an operator checks occasionally, behind the three cards that
  // say how the node is actually doing right now.
  const rel = d.release ?? {}
  const osi = d.node?.os
  if (rel.installed || rel.latest || osi) {
    const lagCell = rel.lag === 'behind'
      ? `<span class="warn">${esc(rel.installed)} → ${esc(rel.latest)} available</span>`
      : rel.lag === 'current' ? `<span class="ok">${esc(rel.installed)} · current</span>`
      : rel.installed ? `<span class="mono">${esc(rel.installed)}</span>`
      : '<span class="sub">unknown</span>'

    // apt answers against its last refresh, so the count is only as good as the
    // lists. Show the age beside it rather than letting a stale zero pass as news.
    // The Pi reports aptAgeHours, Windows reports updatesAgeHours; both mean the
    // age of the scan the count came from.
    const aptAge = osi?.updatesAgeHours ?? osi?.aptAgeHours
    const ageCell = aptAge === undefined ? '<span class="sub">unknown</span>'
      : aptAge > 168 ? `<span class="bad">${Math.round(aptAge / 24)}d — count unreliable</span>`
      : aptAge > 48 ? `<span class="warn">${Math.round(aptAge / 24)}d</span>`
      : `<span class="ok">${aptAge < 1 ? '<1' : Math.round(aptAge)}h</span>`

    groups.production.push(`<section style="--c: var(--acc-ops); --mo:86">
      <h2><span class="ico" aria-hidden="true">📦</span>Software &amp; host</h2>
      <div class="big">${esc(rel.installed ?? '—')}</div>
      <div class="sub">xl1&#8209;cli in the running container</div>
      ${dl([
        ['CLI version', `${lagCell} ${origin('official', d.build)}`],
        rel.ok === false && !rel.disabled && ['Registry', `<span class="warn">${esc(rel.error ?? 'unreachable')}</span>`],
        osi && ['Host updates', osi.updates > 0 ? `<span class="warn">${num(osi.updates)} pending</span>` : '<span class="ok">none pending</span>'],
        osi && osi.securityUpdates > 0 && ['Security updates', `<span class="bad">${num(osi.securityUpdates)}</span>`],
        // "apt lists" is a lie on Windows, and a card that names the wrong tool
        // is a card people stop trusting on the details that matter.
        osi && [d.system?.platform === 'windows' ? 'update scan' : 'apt lists', ageCell],
        osi?.rebootRequired && ['Reboot', '<span class="bad">required</span>'],
        // Ours, not XYO's. The tag never changes across deploys, so this is the
        // only thing on the page that says which dashboard build is answering.
        // The version is a claim until someone can check it. Both halves link
        // out: the version to the repository, the hash to the exact commit this
        // build came from, so anyone reading the page can go and see the code
        // that produced the numbers on it.
        d.build && ['Dashboard', `<span class="mono" title="built ${esc(d.build.builtAt)}">${
          d.build.source
            ? `<a href="${esc(d.build.source)}" target="_blank" rel="noopener noreferrer">${esc(d.build.version)}</a>`
            : esc(d.build.version)}${
          d.build.commit && d.build.commit !== 'unknown'
            ? ` · ${d.build.commitUrl
                ? `<a href="${esc(d.build.commitUrl)}" target="_blank" rel="noopener noreferrer">${esc(d.build.commit)}</a>`
                : `<span title="built from uncommitted changes — this hash is not on GitHub">${esc(d.build.commit)}</span>`}`
            : ''}</span> ${origin('unofficial', d.build)}`],
      ])}
      ${!osi ? '<div class="sub" style="margin-top:8px">host package check off or not yet run</div>' : ''}
      ${d.build ? `<div class="sub credits">
        <span>${MARK_XYO} <a href="${esc(d.build.upstreamUrl)}" target="_blank" rel="noopener noreferrer">${esc(d.build.upstreamName)}</a>
          — the XL1 chain and the <span class="mono">xl1-cli</span> this node runs</span>
        <span>${MARK_OXYON} <a href="${esc(d.build.brandUrl)}" target="_blank" rel="noopener noreferrer">${esc(d.build.brandName)}</a>
          — this dashboard, independent and
          <a href="${esc(d.build.source)}" target="_blank" rel="noopener noreferrer">open</a></span>
      </div>` : ''}
    </section>`)
  }

  // Producer standings — who else is signing blocks, and where we sit.
  //
  // Counted from the same scan that produces "Blocks produced" above, so the
  // two can never disagree. The denominator is blocks actually read, which is
  // why the sample size is printed rather than assumed from the height range.
  const pb = d.peers
  if (pb && pb.producers > 0) {
    const short = (a) => `${String(a).slice(0, 6)}…${String(a).slice(-4)}`
    // A named producer shows its name with the hex kept alongside, not replaced.
    // The address is the identity; the label is a convenience, and dropping the
    // hex would leave nothing to check a suspicious row against.
    const nameCell = (r) => {
      const name = r.label ?? (r.isSelf ? 'this node' : undefined)
      const hex = r.url
        ? `<a class="mono" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" title="${esc(r.address)}">${esc(short(r.address))}</a>`
        : `<span class="mono" title="${esc(r.address)}">${esc(short(r.address))}</span>`
      const you = r.isSelf ? ' <span class="you-badge">YOU</span>' : ''
      return (name ? `<span class="peer-name">${esc(name)}</span> ${hex}` : hex) + you
    }

    const rows = [...(pb.top ?? [])]
    // Our own row matters more than the cut-off. If we rank below the visible
    // top, show us anyway under a break rather than leaving the operator to
    // conclude their node is not producing at all.
    const shown = new Set(rows.map((r) => r.address))
    const outside = pb.self && !shown.has(pb.self.address) ? pb.self : undefined

    // Bars scale to the leader, not to 100. With six producers splitting a
    // chain, every bar against a fixed 100 would be a stub and the ranking —
    // the thing this table exists to show — would be invisible.
    const lead = Math.max(...rows.map((r) => r.sharePercent ?? 0), (pb.self?.sharePercent ?? 0), 0.0001)

    // Window figures are looked up per address rather than re-ranked, so a row
    // keeps its place in the overall table while showing what it did today.
    // A producer with no blocks in a window is a real zero, not missing data —
    // but only once that window has been filled, hence the dash while a
    // backfill is still walking backwards.
    const wToday = pb.windows?.today
    const wWeek = pb.windows?.week
    const cell = (w, addr) => {
      if (!w) return '—'
      const v = w.blocksByAddress?.[addr]
      return num(v ?? 0)
    }

    const tr_ = (r, cls = '') => `<tr class="${cls}${r.isSelf ? ' self' : ''}">
      <td>${num(r.rank)}</td>
      <td>${nameCell(r)}</td>
      <td class="barcell"><div class="peer-bar"><i style="width:${Math.max(r.sharePercent ? 2 : 0, ((r.sharePercent ?? 0) / lead) * 100)}%"></i></div></td>
      <td>${cell(wToday, r.address)}</td>
      <td>${cell(wWeek, r.address)}</td>
      <td>${num(r.blocks)}</td>
      <td>${r.sharePercent !== undefined ? `${r.sharePercent}%` : '—'}</td>
    </tr>`

    const leader = rows[0]
    const mine = pb.self
    // The comparison an operator actually wants: not the raw count, but how far
    // off the top this node is. Same-rank-1 says so instead of printing "0
    // behind", which reads like a deficit.
    // Said per window, because they routinely disagree and the disagreement is
    // the point: a node that was offline for two days is far behind on the
    // total and even for today, and only the second number describes how it is
    // running now.
    const standing = (w, label) => {
      if (!w?.self || !w.leader) return ''
      const gap = w.leader.blocks - w.self.blocks
      const runnerUp = w.top?.[1]
      const text = w.self.rank === 1
        ? `leading by ${num(w.self.blocks - (runnerUp?.blocks ?? w.self.blocks))}`
        : `${num(gap)} behind the leader`
      return `<div class="sub">${label}: #${num(w.self.rank)} of ${num(w.producers)} · ${num(w.self.blocks)} block(s) · ${text}</div>`
    }

    const gapLine = (!mine || !leader) ? ''
      : `${mine.rank === 1
          ? `<div class="sub">overall: leading by ${num(leader.blocks - (rows[1]?.blocks ?? leader.blocks))} block(s)</div>`
          : `<div class="sub">overall: ${num(leader.blocks - mine.blocks)} block(s) behind the leader</div>`}
         ${standing(wToday, 'today')}
         ${standing(wWeek, '7 days')}`

    groups.network.push(`<section class="card-full" style="--c: var(--acc-network); --mo:110">
      <h2><span class="ico" aria-hidden="true">🏁</span>Producer standings</h2>
      ${mine
        ? `<div class="big">#${num(mine.rank)} <span style="font-size:14px;color:var(--muted)">of ${num(pb.producers)}</span></div>
           ${gapLine}`
        : `<div class="big sub" style="font-size:16px">not seen yet</div>
           <div class="sub">this node has not signed a block in the ${num(pb.scannedBlocks)} scanned</div>`}
      ${pb.error ? `<div class="err" style="margin-top:8px">${esc(pb.error)}</div>` : ''}
      <div class="board-wrap">
        <table class="board">
          <thead><tr><th>#</th><th>Producer</th><th></th><th>Today</th><th>7d</th><th>Total</th><th>Share</th></tr></thead>
          <tbody>
            ${rows.map((r) => tr_(r)).join('')}
            ${outside ? tr_(outside, 'gap ') : ''}
          </tbody>
        </table>
      </div>
      <div class="sub" style="margin-top:8px">
        ${num(pb.scannedBlocks)} blocks sampled${pb.scannedFrom !== undefined ? ` (#${num(pb.scannedFrom)}–#${num(pb.scannedTo)})` : ''}${pb.since ? ` · since ${new Date(pb.since).toLocaleDateString()}` : ''}.
        <span title="Totals persist across restarts. Day buckets are kept for ${num(pb.daysKept ?? 0)} days.">Days are ${esc(pb.dayTz ?? 'UTC')}.</span>
      </div>
      ${pb.dayTzError ? `<div class="sub warn">${esc(pb.dayTzError)}</div>` : ''}
      ${pb.daysError ? `<div class="sub warn">day history: ${esc(pb.daysError)}</div>` : ''}
      ${pb.evicted ? `<div class="sub warn">${num(pb.evicted.addresses)} address(es) with no block in
        ${num(pb.evicted.quietDays)} days were dropped from the totals to bound the tally, taking
        ${num(pb.evicted.blocks)} block(s) with them — the total column no longer sums to every block scanned.
        ${pb.evicted.overCap ? 'More producers are active than the cap allows, so nothing further is dropped.' : ''}</div>` : ''}
      ${pb.daysComplete === false
        ? `<div class="sub warn">Day history still filling in — it reaches back to #${num(pb.daysFrom)} of #${num(pb.scannedFrom)}, so older windows undercount until it finishes.</div>`
        : ''}
      ${pb.undated ? `<div class="sub warn">${num(pb.undated)} block(s) carried no timestamp and are in the totals only.</div>` : ''}
      ${pb.multiSigner ? `<div class="sub">Some blocks carry more than one signer, so the share column can total over 100%.</div>` : ''}
      ${(pb.labels?.rejected ?? []).map((x) => `<div class="sub warn">DASH_PEER_LABELS: ${esc(x)}</div>`).join('')}
      ${(pb.labels?.ambiguous ?? []).map((x) => `<div class="sub warn">Label “${esc(x.name)}” (${esc(x.key)}) ${
        x.clash ? `collides with “${esc(x.clash)}” on the same address` : `matches ${num(x.matches)} producers — left unlabelled rather than guessed`}</div>`).join('')}
      ${(pb.labels?.unmatched ?? []).map((x) => `<div class="sub">Label “${esc(x.name)}” (${esc(x.key)}) matches no producer in this sample yet.</div>`).join('')}
      ${dv.productionBehind ? `<div class="sub warn">${num(dv.productionBehind)} block(s) still to catch up on.</div>` : ''}
    </section>`)
  }

  // Log tail, newest first, outside every group and always last — a scroll box
  // this size reads as an afterthought anywhere but the bottom of the page.
  if (d.node?.recentLog?.length) {
    logHtml = `<section class="card-full">
      <h2><span class="ico" aria-hidden="true">📜</span>Producer log — newest first (${d.node.recentLog.length} lines)</h2>
      <pre class="log">${esc([...d.node.recentLog].reverse().join('\n'))}</pre>
      <div class="logfoot">Most recent at the top. Collected ${d.node.ageSeconds ?? '?'}s ago.</div>
    </section>`
  }

  const groupSection = (icon, title, items) => items.length
    ? `<section class="group"><h2 class="group-heading"><span class="ico" aria-hidden="true">${icon}</span>${esc(title)}</h2><div class="group-grid">${items.join('')}</div></section>`
    : ''

  $('grid').innerHTML = bannerHtml
    + `<div class="kpi-row">${kpiRow(d)}</div>`
    + groupSection('⚡', 'Producer performance', groups.performance)
    + groupSection('📶', 'Network health', groups.network)
    + groupSection('🔥', 'Production performance', groups.production)
    + groupSection('📊', 'Analytics', groups.analytics)
    + logHtml

  $('foot').innerHTML = (d.problems?.length
    ? `<ul class="problems">${d.problems.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>`
    : '')
    + `<div style="margin-top:8px">updated ${new Date(d.generatedAt).toLocaleTimeString()} · dashboard up since ${new Date(d.dashboardStartedAt).toLocaleString()} · <a href="/api/status${location.search}">JSON</a></div>`
    + (d.build ? `<div>build ${esc(d.build.version)}${d.build.commit && d.build.commit !== 'unknown' ? ` · ${esc(d.build.commit)}` : ''}${d.build.builtAt && d.build.builtAt !== 'unknown' ? ` · built ${new Date(d.build.builtAt).toLocaleString()}` : ''}</div>` : '')
    // Said plainly, on every page, rather than left to be inferred. Someone
    // shown a screenshot of this should not come away thinking XYO shipped it.
    + `<div class="whose">
         <span class="who">🛠️ Built by LewSales</span>
         <span class="sep">·</span>
         <span>Independent community project — <strong>not affiliated with, endorsed by, or supported by XYO Network</strong>.</span>
         <span class="sep">·</span>
         <a href="${esc(d.build?.source ?? 'https://github.com/LewSales/xl1-block-producer-pi')}" target="_blank" rel="noopener noreferrer">source &amp; issues ↗</a>
       </div>`
}

async function tick(force) {
  // A hidden tab is a tab nobody is reading. Left open on a second monitor it
  // would otherwise pull the whole payload every five seconds forever, and on
  // the Pi that is the dashboard's largest single cost. The fetch is skipped
  // rather than the timer cancelled, so nothing has to be restarted.
  //
  // A tab can load already hidden -- a link opened from another app, a moment
  // before it becomes the foreground tab -- and that is not "nobody is
  // reading", it just has not been looked at yet. Skipping that first tick the
  // same way left the page on "connecting..." forever: without a real
  // hidden-to-visible transition afterward, nothing ever tried again. `force`
  // lets the initial call through regardless of visibility; the recurring
  // interval below keeps the original skip-when-hidden behavior.
  if (document.hidden && !force) return
  try {
    const res = await fetch(`/api/status${location.search}`, { cache: 'no-store' })
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    render(await res.json())
  } catch (e) {
    setStatusPill('offline', 'DASHBOARD UNREACHABLE')
    $('foot').textContent = String(e)
  }
}
tick(true)
setInterval(tick, 5000)
// Coming back to the tab should not mean waiting out the rest of an interval to
// see a page that is up to five seconds stale.
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick() })
</script>
</body>
</html>
