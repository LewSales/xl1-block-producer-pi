<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XL1 Producer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea;
    --fg: #14171a; --muted: #666e78;
    --ok: #1a7f47; --warn: #a86500; --bad: #b3261e; --accent: #572aff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013; --panel: #171a1f; --line: #262b33;
      --fg: #e8eaed; --muted: #939ba6;
      --ok: #4ec97f; --warn: #e0a341; --bad: #ef6a60; --accent: #8f74ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  .net { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .pill {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid transparent;
  }
  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: color-mix(in srgb, var(--ok) 32%, transparent); }
  .pill.degraded { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
  .pill.down { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 32%, transparent); }
  /* Columns, not grid rows.
     A row grid is as tall as its tallest card and wraps a leftover card onto a
     row of its own — five items across four columns left one card beside three
     columns of nothing. Balancing that by hand only holds until a card hides
     for want of data and the count changes again.
     Multi-column packs top to bottom and balances the column heights itself, so
     there is no leftover row and no hole under a short card. break-inside keeps
     a card whole; column-span lets the two full-width cards break out. */
  main { padding: 20px; max-width: 1720px; margin: 0 auto;
         columns: 320px; column-gap: 16px; }
  /* break-inside on the CARD, not on the wrapper. A stack is two cards that
     want to be together, not one indivisible slab — making the wrapper
     unbreakable handed the balancer a 1000px block it could not move, so one
     column ran to the floor while two others finished halfway up. Now a stack
     is a plain block: the balancer keeps it together when it fits and splits it
     when it must, and no card is ever cut in half. */
  main > * { margin: 0 0 16px; }
  section { break-inside: avoid; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; }
  section h2 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; align-items: baseline; font-size: 13px; }
  dt { color: var(--muted); white-space: nowrap; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .big { font-size: 23px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar > i.warn { background: var(--warn); } .bar > i.bad { background: var(--bad); }
  ul.problems { margin: 10px 0 0; padding-left: 18px; color: var(--warn); }
  /* Standings. A wide table on a 480px phone must scroll inside its own box
     rather than stretching the page sideways. */
  .board-wrap { overflow-x: auto; margin-top: 4px; }
  table.board { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.board th { text-align: right; font-weight: 600; color: var(--muted); padding: 4px 6px; white-space: nowrap; }
  table.board th:nth-child(2) { text-align: left; }
  table.board td { padding: 4px 6px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.board td:nth-child(2) { text-align: left; }
  table.board tr.self { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 650; }
  table.board tr + tr td { border-top: 1px solid var(--line); }
  table.board tr.gap td { border-top: 2px dashed var(--line); }
  .peer-name { font-weight: 600; margin-right: 4px; }
  /* Four columns stretched across a 1280px card put the name and its numbers at
     opposite edges, which is a lot of eye travel to compare two rows. */
  table.board { max-width: 760px; }
  /* Candidate race. The pulse is one cell per chain block, oldest left, so the
     eye reads recency rightward the way the log does. Sized to stay legible at
     64 cells on a phone without a media query. */
  .pulse { display: flex; gap: 2px; align-items: flex-end; margin: 6px 0 2px; }
  .pulse > i { flex: 1 1 0; min-width: 2px; height: 14px; border-radius: 1px;
               background: color-mix(in srgb, var(--line) 80%, transparent); }
  .pulse > i.win { background: var(--accent); height: 20px; }
  /* Colour is not the only signal: a win is also taller. */
  .reason { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; margin-top: 6px; }
  .reason-bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .reason-bar > i { display: block; height: 100%; background: color-mix(in srgb, var(--warn) 65%, transparent); }
  .score-row { display: grid; grid-template-columns: 7.5em 2.5em 1fr; gap: 3px 8px; align-items: center; margin-top: 5px; }
  .score-bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .score-bar > i { display: block; height: 100%; background: color-mix(in srgb, var(--ok) 65%, transparent); }
  .score-bar.mid > i { background: color-mix(in srgb, var(--warn) 65%, transparent); }
  .score-bar.low > i { background: color-mix(in srgb, var(--bad) 65%, transparent); }
  .conf { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .lat-row { display: grid; grid-template-columns: 5.5em 5em 1fr; gap: 4px 8px; align-items: center; margin-top: 5px; }
  .lat-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .lat-bar > i { display: block; height: 100%; background: color-mix(in srgb, var(--c-chain) 70%, transparent); }
  .lat-bar.wire > i { background: color-mix(in srgb, var(--ok) 70%, transparent); }
  .lat-bar.tail > i { background: color-mix(in srgb, var(--warn) 70%, transparent); }
  /* Identity disclosure. <details> rather than a JS toggle: it is keyboard
     reachable, works with the page's own find-in-page, and costs no script. */
  details.ident { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  details.ident > summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; }
  details.ident > summary::-webkit-details-marker { display: none; }
  details.ident > summary::before { content: '▸ '; }
  details.ident[open] > summary::before { content: '▾ '; }
  details.ident > summary:hover, details.ident > summary:focus-visible { color: var(--fg); }
  details.ident dl { margin-top: 6px; }
  .spark rect { fill: color-mix(in srgb, var(--c) 70%, transparent); }
  .spark.ok rect { fill: color-mix(in srgb, var(--ok) 70%, transparent); }
  .peer-bar { height: 7px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 60px; }
  .peer-bar > i { display: block; height: 100%; background: color-mix(in srgb, var(--c-peers) 70%, transparent); }
  table.board tr.self .peer-bar > i { background: var(--accent); }
  table.board td.barcell { width: 40%; padding-left: 14px; }
  pre.log {
    margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px;
    max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  footer { padding: 0 20px 28px; color: var(--muted); font-size: 12px; }
  a { color: var(--accent); }
  .err { color: var(--bad); font-size: 12.5px; }

  /* Stat tiles. A dense grid reads faster than a long definition list once
     there are more than about six figures to take in at a glance. */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; margin-top: 10px; }
  .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .tile .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .tile .v { font-size: 19px; font-weight: 640; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .tile .n { color: var(--muted); font-size: 11px; margin-top: 2px; }

  /* Sparklines. preserveAspectRatio="none" stretches the box to the card, so
     the stroke needs non-scaling-stroke or it thins out as the card widens. */
  .spark { display: block; width: 100%; height: 40px; margin-top: 12px; overflow: visible; }
  .spark path.line { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .spark path.area { fill: color-mix(in srgb, var(--accent) 13%, transparent); stroke: none; }
  .spark.ok path.line { stroke: var(--ok); } .spark.ok path.area { fill: color-mix(in srgb, var(--ok) 13%, transparent); }
  .sparkfoot { display: flex; justify-content: space-between; color: var(--muted); font-size: 10.5px; margin-top: 3px; }
  .trendbars { display: flex; align-items: flex-end; gap: 4px; margin-top: 10px; }
  .trendbar { flex: 1 1 0; min-width: 8px; display: flex; flex-direction: column; align-items: stretch; }
  .trendbar-fill { border-radius: 3px 3px 0 0; background: var(--c, var(--accent)); min-height: 3px; }
  .trendbar { height: 56px; justify-content: flex-end; }
  .trendbar-n { font-size: 10px; color: var(--muted); text-align: center; margin-top: 3px;
                font-variant-numeric: tabular-nums; }
  .brand { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  /* On a phone the header wrapped into "title + chip", then "chain id + build",
     then the status pill — which buried our own version next to a chain hash it
     has nothing to do with. Narrow screens put the build on its own line
     directly under the title, where it reads as the version OF this thing. */
  @media (max-width: 720px) {
    header { align-items: flex-start; gap: 8px 10px; }
    header h1 { order: 0; }
    header .chip { order: 1; }
    header .brand { order: 2; flex-basis: 100%; margin-top: -2px; }
    header .net { order: 3; }
    header .spacer { display: none; }
    header .pill { order: 4; }
  }
  .brand a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--line); }
  .brand a:hover, .brand a:focus-visible { color: var(--fg); border-bottom-color: currentColor; }
  .credits { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line);
             display: grid; gap: 4px; line-height: 1.45; }
  .credits a { color: var(--accent); }
  .origin { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .brand svg { flex: none; }
  .wide { column-span: all; }
  /* One block holding two cards, stacked, kept whole by break-inside above.
     The pairing survives the column layout: a stack is a single item, so its
     two cards cannot be split across a column boundary. */
  /* Deliberately a plain block rather than flex or grid: a flex container
     cannot fragment across a column boundary in most engines, which is what
     made the wrapper unbreakable in the first place. */
  .stack > section { margin: 0 0 16px; }

  /* Per-card accent. One hue per subject, carried by the heading, the rule
     under it and that card's sparkline, so a glance finds the right panel
     before the words are read. Set with style="--c: var(--c-chain)". */
  :root {
    --c-producer: #2f7ae5; --c-chain: #7a4ddb; --c-rewards: #1a7f47;
    --c-software: #b4690e; --c-trend: #0d7c8f; --c-pi: #c0392b; --c-log: #5b6472;
    --c-peers: #8a5a2b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-producer: #6aa8ff; --c-chain: #a98bff; --c-rewards: #4ec97f;
      --c-software: #e0a341; --c-trend: #48c3d6; --c-pi: #ff8a7a; --c-log: #9aa4b2;
      --c-peers: #d7a06a;
    }
  }
  section { position: relative; overflow: hidden; }
  /* A hairline of the card's own colour along the top edge. */
  section[style*="--c"]::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: linear-gradient(90deg, var(--c), transparent 70%);
  }
  section h2 { display: flex; align-items: center; gap: 7px; }
  section[style*="--c"] h2 { color: var(--c); }
  section[style*="--c"] .spark path.line { stroke: var(--c); }
  section[style*="--c"] .spark path.area { fill: color-mix(in srgb, var(--c) 14%, transparent); }
  section[style*="--c"] .bar > i:not(.warn):not(.bad) { background: var(--c); }
  .ico { font-size: 14px; line-height: 1; filter: saturate(1.1); }

  /* Attribution. Deliberately plain — it is a disclaimer, not a badge. */
  .whose {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  }
  .whose .who { font-weight: 600; color: var(--fg); }
  .whose .sep { color: var(--line); }
  .chip {
    font-size: 10.5px; padding: 2px 7px; border-radius: 999px; font-weight: 600;
    letter-spacing: 0.03em; border: 1px solid var(--line); color: var(--muted);
    white-space: nowrap;
  }
  .logfoot { color: var(--muted); font-size: 11px; margin-top: 7px; }
  .banner {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12.5px;
    border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
    background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--fg);
  }
  .banner b { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>⛏️ XL1 Block Producer</h1>
  <span class="chip" title="An independent project. Not built, endorsed, or supported by XYO.">unofficial</span>
  <span class="net" id="net">—</span>
  <span class="spacer"></span>
  <!-- Build identity, next to the mark. Inline SVG rather than an image file:
       one less request, scales at any size, and it takes its colour from the
       theme instead of shipping two versions. currentColor for the ring so it
       reads in light and dark; the gold bars are the only fixed colour. -->
  <span class="brand" id="brand" hidden>
    <span id="brandmark"></span>
    <a class="mono" id="build" target="_blank" rel="noopener noreferrer">—</a>
  </span>
  <span class="pill" id="overall">connecting…</span>
</header>
<main id="grid"></main>
<footer id="foot">—</footer>

<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const num = (n) => (n === undefined || n === null || Number.isNaN(n)) ? '—' : Number(n).toLocaleString()
const bytes = (b) => {
  if (!b && b !== 0) return '—'
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; let v = b
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++ }
  return `${v.toFixed(v < 10 && i > 0 ? 1 : 0)} ${u[i]}`
}
const dur = (s) => {
  if (s === undefined || s === null) return '—'
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60)
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`
}
// Provenance marks. xl1-cli is XYO's own software; this dashboard is not, and
// the page says so in the header already. Putting the two side by side in
// Software & host makes the distinction concrete where the versions are read:
// one line is theirs, the next is ours.
//
// The XYO mark is drawn as a plain hexagon outline rather than a facsimile of
// their logo — enough to read as "theirs" without passing itself off as their
// trademark on a page that exists to say it is unaffiliated.
const MARK_XYO = `<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="vertical-align:-1px">
  <path d="M12 2.5 L20.5 7.25 L20.5 16.75 L12 21.5 L3.5 16.75 L3.5 7.25 Z"
        fill="none" stroke="currentColor" stroke-width="2"/></svg>`
const MARK_OXYON = `<svg viewBox="0 0 48 48" width="12" height="12" aria-hidden="true" style="vertical-align:-1px">
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="butt">
    <path d="M23 5 A19 19 0 0 0 23 43"/><path d="M25 5 A19 19 0 0 1 25 43"/>
    <path d="M11.5 16 L21 24 L11.5 32"/><path d="M36.5 16 L27 24 L36.5 32"/>
  </g>
  <rect x="9" y="22" width="12" height="4" fill="#c99a3b"/>
  <rect x="27" y="22" width="12" height="4" fill="#c99a3b"/></svg>`
const origin = (kind, b = {}) => {
  const link = (href, title, inner) => href
    ? `<a class="origin" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(title)}">${inner}</a>`
    : `<span class="origin" title="${esc(title)}">${inner}</span>`
  return kind === 'official'
    ? link(b.upstreamUrl, `xl1-cli is ${b.upstreamName ?? 'XYO'}'s own software, running unmodified in the container`,
        `${MARK_XYO} official`)
    : link(b.brandUrl, `This dashboard is an independent project by ${b.brandName ?? 'the operator'} — not built, endorsed, or supported by XYO`,
        `${MARK_OXYON} unofficial`)
}

const dl = (rows) => `<dl>${rows.filter(Boolean).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`
const tiles = (items) => `<div class="tiles">${items.filter(Boolean).map(([k, v, n]) =>
  `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ''}</div>`).join('')}</div>`

/** A sparkline of the CHANGE between samples, for series that only ever rise.
 *
 *  Height and reward balance are cumulative counters, so plotting the value
 *  draws a line that goes up and to the right no matter what the node did —
 *  the same picture whether it won ten blocks or none, because the axis
 *  rescales. The delta answers the question actually being asked: WHEN did
 *  something happen, and how much.
 *
 *  It reads especially well for rewards, where the chain pays in fixed 50 XL1
 *  steps: every bar is a block won, and the gaps between bars are the dry
 *  spells. `summary` turns the same numbers into one line of plain language,
 *  because a bar chart with no scale is still just a shape.
 */
const sparkDelta = (series, cls = '', summary) => {
  const pts = (series ?? []).map((p) => Number(p.v)).filter((v) => !Number.isNaN(v))
  if (pts.length < 3) return `<div class="sub" style="margin-top:10px">collecting — needs a few more samples</div>`
  // Negative steps mean a restart or a reset, not a loss. Clamped rather than
  // drawn, so one counter reset cannot invert the whole chart.
  const deltas = []
  for (let i = 1; i < pts.length; i++) deltas.push(Math.max(0, pts[i] - pts[i - 1]))
  const max = Math.max(...deltas) || 1
  const total = deltas.reduce((a, b) => a + b, 0)
  const active = deltas.filter((d) => d > 0).length
  const W = 100, H = 40
  const bw = W / deltas.length
  const bars = deltas.map((v, i) => {
    // A zero stays visibly zero; anything above it gets at least a sliver so a
    // small step is not indistinguishable from nothing happening.
    const h = v === 0 ? 0 : Math.max(1.5, (v / max) * H)
    return `<rect x="${(i * bw).toFixed(2)}" y="${(H - h).toFixed(2)}" width="${Math.max(0.6, bw * 0.8).toFixed(2)}" height="${h.toFixed(2)}"/>`
  }).join('')
  const fmt = (v) => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : Number(v.toFixed(2)).toLocaleString()
  return `<svg class="spark ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>
    <div class="sparkfoot"><span>${summary ? summary(total, active, deltas.length, max) : `+${fmt(total)}`}</span><span>${deltas.length} intervals</span></div>`
}

/** A sparkline from a history series. Says "collecting" rather than drawing a
 *  flat line from one point — an empty chart that looks like a dead one is
 *  worse than an honest label. */
const spark = (series, cls = '') => {
  const pts = (series ?? []).map((p) => Number(p.v)).filter((v) => !Number.isNaN(v))
  if (pts.length < 2) return `<div class="sub" style="margin-top:10px">collecting — needs a few more samples</div>`
  const min = Math.min(...pts), max = Math.max(...pts), span = (max - min) || 1
  const W = 100, H = 40
  const d = pts.map((v, i) => `${((i / (pts.length - 1)) * W).toFixed(2)},${(H - ((v - min) / span) * H).toFixed(2)}`)
  const fmt = (v) => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : Number(v.toFixed(2)).toLocaleString()
  return `<svg class="spark ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path class="area" d="M0,${H} L${d.join(' L')} L${W},${H} Z"/>
      <path class="line" d="M${d.join(' L')}"/>
    </svg>
    <div class="sparkfoot"><span>${fmt(min)}</span><span>${pts.length} samples</span><span>${fmt(max)}</span></div>`
}

const bar = (pct, warnAt = 70, badAt = 90) => {
  const p = Math.max(0, Math.min(100, pct ?? 0))
  const cls = p >= badAt ? 'bad' : p >= warnAt ? 'warn' : ''
  return `<div class="bar"><i class="${cls}" style="width:${p}%"></i></div>`
}

function render(d) {
  $('overall').textContent = d.status === 'ok' ? 'healthy' : d.status
  $('overall').className = `pill ${d.status}`
  $('net').textContent = d.chain?.ok ? `${d.chain.networkName} · chain ${d.chain.chainId.slice(0, 10)}…` : 'chain unreachable'

  // Build identity in the header, beside the mark. Hidden until there is one to
  // show, so an older dashboard that reports no build does not render an empty
  // badge next to a logo.
  const brand = $('brand')
  $('brandmark').innerHTML = MARK_OXYON.replace('width="12" height="12"', 'width="17" height="17"')
  if (d.build?.version) {
    const buildEl = $('build')
    buildEl.textContent = d.build.commit && d.build.commit !== 'unknown'
      ? `${d.build.version} · ${d.build.commit}`
      : d.build.version
    // Points at the commit when there is one to point at, the repository
    // otherwise. Never at a hash that is not there to be read.
    buildEl.href = d.build.commitUrl ?? d.build.source ?? '#'
    brand.title = d.build.builtAt && d.build.builtAt !== 'unknown'
      ? `build ${d.build.version} · ${d.build.commit} · built ${new Date(d.build.builtAt).toLocaleString()}`
      : `build ${d.build.version}`
    brand.hidden = false
  } else {
    brand.hidden = true
  }

  const cards = []
  const dv = d.derived ?? {}

  // The one thing that explains a healthy node producing nothing. Loud, at the
  // top, in its own banner — it is the answer to the question everything else
  // on this page raises but cannot settle.
  if (d.node?.eligibility?.blocked && !d.node?.eligibilityIgnored) {
    cards.push(`<section class="wide" style="border-color:color-mix(in srgb,var(--bad) 40%,transparent)">
      <h2><span class="ico" aria-hidden="true">⛔</span>Producer cannot produce</h2>
      <div class="big bad">${esc(d.node.eligibility.reason)}</div>
      <div class="sub">the node said so itself, within the last ${esc(d.node.eligibility.window)}</div>
      <div class="banner">Every other signal here can read perfectly healthy while this is true.
        The container runs, the health probe passes, the chain is reachable — and no block this node
        builds will be accepted.</div>
    </section>`)
  }

  // Producer
  const c = d.node?.container
  const healthClass = d.health?.ok ? 'ok' : 'bad'
  cards.push(`<section style="--c: var(--c-producer)">
    <h2><span class="ico" aria-hidden="true">⚙️</span>Producer</h2>
    <div class="big ${healthClass}">${d.health?.ok ? 'Live' : 'Not responding'}</div>
    <div class="sub">/livez on ${esc(d.health?.endpoint ?? '')}</div>
    ${dl([
      ['Container', c ? `<span class="${c.running ? 'ok' : 'bad'}">${esc(c.state ?? '—')}</span>` : '—'],
      c && ['Container uptime', esc(c.uptime ?? '—')],
      c && ['Restarts', `${num(c.restartCount)}${c.restartCount > 3 ? ' <span class="warn">⚠</span>' : ''}`],
      c && ['Image', `<span class="mono">${esc(c.image ?? '—')}</span>`],
      dv.producedObserved !== undefined && ['Blocks produced',
        `<span class="${dv.producedObserved > 0 ? 'ok' : ''}">${num(dv.producedObserved)}</span>`
        + (dv.producedSince !== undefined ? ` <span class="sub">since #${num(dv.producedSince)}</span>` : '')],
      dv.producedSharePercent !== undefined && ['Share of chain', `${dv.producedSharePercent}%`],
      dv.lastBlock !== undefined && ['Last produced', dv.lastBlockUrl
        ? `<a href="${esc(dv.lastBlockUrl)}" target="_blank" rel="noopener noreferrer">#${num(dv.lastBlock)}</a>`
        : `#${num(dv.lastBlock)}`],
      dv.blocksSinceLast !== undefined && ['Last win', dv.blocksSinceLast === 0
        ? '<span class="ok">this block</span>'
        : `${num(dv.blocksSinceLast)} block${dv.blocksSinceLast === 1 ? '' : 's'} ago`],
      dv.lastBlock === undefined && dv.producedObserved === 0 &&
        ['Last produced', '<span class="sub">none in the observed range</span>'],
      dv.productionError && ['Block scan', `<span class="warn">${esc(dv.productionError)}</span>`],
      d.node?.errorCount !== undefined && ['Log errors', d.node.errorCount > 0
        ? `<span class="warn">${num(d.node.errorCount)} error${d.node.errorCount === 1 ? '' : 's'}</span>`
        : '<span class="ok">none</span>'],
      d.node?.eligibility && ['Eligibility', d.node.eligibility.blocked
        ? (d.node.eligibilityIgnored
            ? `<span class="sub">${esc(d.node.eligibility.reason)}</span> <span class="ok">· ${esc(d.node.eligibilityNote ?? 'not enforced here')}</span>`
            : `<span class="bad">${esc(d.node.eligibility.reason)}</span>`)
        : `<span class="ok">no complaint in ${esc(d.node.eligibility.window)}</span>`],
    ])}
    ${d.node?.ok === false ? `<div class="err" style="margin-top:8px">${esc(d.node.error)}</div>` : ''}
    ${d.node?.stale ? `<div class="err" style="margin-top:8px">collector data ${d.node.ageSeconds}s old</div>` : ''}
  </section>`)

  // Chain
  if (d.chain?.ok) {
    cards.push(`<section style="--c: var(--c-chain)">
      <h2><span class="ico" aria-hidden="true">⛓️</span>Chain</h2>
      <div class="big">${num(d.chain.currentBlock)}</div>
      <div class="sub">current block · finalized ${num(d.chain.finalizedBlock)}</div>
      ${dl([
        ['Finalization lag', `${num(d.chain.finalizationLag)} blocks`],


        ['Explorer', `<a href="${esc(d.chain.explorerUrl)}" target="_blank" rel="noopener noreferrer">open</a>`],
      ])}
      <details class="ident"><summary>Chain identity</summary>
        ${dl([
          ['Chain ID', `<span class="mono" style="word-break:break-all">${esc(d.chain.chainId)}</span>`],
          ['Matches preset', d.chain.chainIdMatchesPreset ? '<span class="ok">✓ yes</span>' : '<span class="bad">! NO</span>'],
        ])}
      </details>
      ${sparkDelta(d.history?.height, '', (total, active, intervals) =>
        `${num(total)} block(s) · ${total > 0 ? `${(dv.observedSeconds / total).toFixed(0)}s each` : 'chain idle'}`)}
      ${tiles([
        ['Block time', dv.secondsPerBlock ? `${dv.secondsPerBlock}s` : '—', 'observed'],
        ['Chain rate', dv.blocksPerHourChain !== undefined ? `${num(dv.blocksPerHourChain)}/h` : '—', 'blocks per hour'],
        // Age of the newest block we have seen. Climbing past a couple of block
        // times means the chain has stalled, which nothing else here would say.
        ['Head age', dv.headAgeSeconds !== undefined
          ? `<span class="${dv.headAgeSeconds > 180 ? 'warn' : ''}">${dv.headAgeSeconds}s</span>` : '—',
          'since newest block'],
        ['Watching', dv.observedSeconds ? dur(dv.observedSeconds) : '—', `${num(dv.samples)} samples`],
      ])}
    </section>`)
  } else {
    cards.push(`<section style="--c: var(--c-chain)"><h2><span class="ico" aria-hidden="true">⛓️</span>Chain</h2><div class="big bad">Unreachable</div>
      <div class="err" style="margin-top:8px">${esc(d.chain?.error ?? 'unknown')}</div></section>`)
  }

  // Rewards
  const b = d.chain?.balances ?? {}
  // Addresses link straight into the explorer — the lookup an operator does most.
  const bw = dv.blocksByWindow
  const addrCell = (x) => x?.url
    ? `<a class="mono" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.address)}</a>`
    : `<span class="mono">${esc(x?.address)}</span>`
  // Forty hex characters twice over dominated this card for something an
  // operator verifies once and then never reads again. Demoted behind a
  // disclosure — still one click away, still linked, still selectable, and
  // still the full string rather than a truncation you cannot check.
  const shortAddr = (a) => `${String(a ?? '').slice(0, 6)}…${String(a ?? '').slice(-4)}`
  if (b.reward || b.producer) {
    cards.push(`<section style="--c: var(--c-rewards)">
      <h2><span class="ico" aria-hidden="true">💰</span>Rewards</h2>
      ${b.reward?.xl1 ? `<div class="big">${esc(b.reward.xl1)} <span style="font-size:14px;color:var(--muted)">XL1</span></div>
        <div class="sub">reward address balance</div>` : ''}
      ${dl([
        b.reward?.sinceStart && ['Since dashboard start', `${esc(b.reward.sinceStart.xl1)} XL1`],
        b.reward?.error && ['Reward lookup', `<span class="bad">${esc(b.reward.error)}</span>`],
        b.producer?.xl1 && ['Producer balance', `${esc(b.producer.xl1)} XL1`],
        dv.rewardEqualsProducer && ['Signer', '<span class="ok">✓ same as reward address</span>'],
      ])}
      <details class="ident"><summary>Addresses ${b.reward ? `· ${esc(shortAddr(b.reward.address))}` : ''}</summary>
        ${dl([
          b.reward && ['Reward address', addrCell(b.reward)],
          b.producer && !dv.rewardEqualsProducer && ['Producer address', addrCell(b.producer)],
        ])}
      </details>
      <div class="sub" style="margin-top:7px" title="At step 0 the block reward is 500 XL1 and the producer share is 10%. Only accepted blocks pay — a published candidate that loses its race earns nothing.">
        Each accepted block pays <strong>~50 XL1</strong> — 10% of the 500 XL1 block reward.
      </div>
      ${bw ? tiles([
        // One cumulative total cannot tell a node earning steadily from one that
        // earned it all yesterday. The hour is withheld until the ring covers
        // most of one, rather than reporting a partial window as a whole.
        ['This hour', bw.hour !== undefined ? num(bw.hour) : '—',
          bw.hour !== undefined ? 'blocks' : `${Math.round((bw.hourCoverageSeconds ?? 0) / 60)}m observed`],
        ['Today', num(bw.today), 'blocks'],
        ['7 days', num(bw.week), 'blocks'],
        ['All time', bw.total !== undefined ? num(bw.total) : '—', 'since scanning began'],
      ]) : ''}
      ${sparkDelta(d.history?.reward, 'ok', (total, active, intervals, max) =>
        // The chain pays ~50 XL1 per block, so each bar is a win and the count
        // of non-empty intervals is how many times this node was paid.
        total > 0
          ? `+${num(Number(total.toFixed(4)))} XL1 · ${num(active)} payout(s)`
          : `no reward movement in ${num(intervals)} intervals`)}
      ${tiles([
        ['Per hour', dv.rewardPerHour !== undefined ? `${num(dv.rewardPerHour)}` : '—', 'XL1 observed'],
        ['Per day', dv.rewardPerDay !== undefined ? `${num(dv.rewardPerDay)}` : '—',
          dv.rewardPerDay !== undefined ? 'extrapolated' : `needs ${Math.max(0, 15 - Math.round((dv.observedSeconds ?? 0) / 60))}m more`],
        ['Blocks/hr', dv.blocksPerHourNode !== undefined ? `${num(dv.blocksPerHourNode)}` : '—', 'produced by this node'],
        // Balance says how much; this says how recently. A node that stopped
        // earning an hour ago has the same balance as one still earning.
        ['Last payout', dv.lastPayoutSeconds !== undefined ? dur(dv.lastPayoutSeconds) + ' ago' : '—',
          dv.lastPayoutXl1 !== undefined ? `+${num(dv.lastPayoutXl1)} XL1` : 'none seen yet'],
      ])}
    </section>`)
  }

  // Software and host — the two layers that rot quietly while every other
  // signal on this page stays green.
  const rel = d.release ?? {}
  const osi = d.node?.os
  if (rel.installed || rel.latest || osi) {
    const lagCell = rel.lag === 'behind'
      ? `<span class="warn">${esc(rel.installed)} → ${esc(rel.latest)} available</span>`
      : rel.lag === 'current' ? `<span class="ok">${esc(rel.installed)} · current</span>`
      : rel.installed ? `<span class="mono">${esc(rel.installed)}</span>`
      : '<span class="sub">unknown</span>'

    // apt answers against its last refresh, so the count is only as good as the
    // lists. Show the age beside it rather than letting a stale zero pass as news.
    const aptAge = osi?.aptAgeHours
    const ageCell = aptAge === undefined ? '<span class="sub">unknown</span>'
      : aptAge > 168 ? `<span class="bad">${Math.round(aptAge / 24)}d — count unreliable</span>`
      : aptAge > 48 ? `<span class="warn">${Math.round(aptAge / 24)}d</span>`
      : `<span class="ok">${aptAge < 1 ? '<1' : Math.round(aptAge)}h</span>`

    cards.push(`<section style="--c: var(--c-software)">
      <h2><span class="ico" aria-hidden="true">📦</span>Software &amp; host</h2>
      <div class="big">${esc(rel.installed ?? '—')}</div>
      <div class="sub">xl1&#8209;cli in the running container</div>
      ${dl([
        ['CLI version', `${lagCell} ${origin('official', d.build)}`],
        rel.ok === false && !rel.disabled && ['Registry', `<span class="warn">${esc(rel.error ?? 'unreachable')}</span>`],
        osi && ['Host updates', osi.updates > 0 ? `<span class="warn">${num(osi.updates)} pending</span>` : '<span class="ok">none pending</span>'],
        osi && osi.securityUpdates > 0 && ['Security updates', `<span class="bad">${num(osi.securityUpdates)}</span>`],
        osi && ['apt lists', ageCell],
        osi?.rebootRequired && ['Reboot', '<span class="bad">required</span>'],
        // Ours, not XYO's. The tag never changes across deploys, so this is the
        // only thing on the page that says which dashboard build is answering.
        // The version is a claim until someone can check it. Both halves link
        // out: the version to the repository, the hash to the exact commit this
        // build came from, so anyone reading the page can go and see the code
        // that produced the numbers on it.
        d.build && ['Dashboard', `<span class="mono" title="built ${esc(d.build.builtAt)}">${
          d.build.source
            ? `<a href="${esc(d.build.source)}" target="_blank" rel="noopener noreferrer">${esc(d.build.version)}</a>`
            : esc(d.build.version)}${
          d.build.commit && d.build.commit !== 'unknown'
            ? ` · ${d.build.commitUrl
                ? `<a href="${esc(d.build.commitUrl)}" target="_blank" rel="noopener noreferrer">${esc(d.build.commit)}</a>`
                : `<span title="built from uncommitted changes — this hash is not on GitHub">${esc(d.build.commit)}</span>`}`
            : ''}</span> ${origin('unofficial', d.build)}`],
      ])}
      ${!osi ? '<div class="sub" style="margin-top:8px">host package check off or not yet run</div>' : ''}
      ${d.build ? `<div class="sub credits">
        <span>${MARK_XYO} <a href="${esc(d.build.upstreamUrl)}" target="_blank" rel="noopener noreferrer">${esc(d.build.upstreamName)}</a>
          — the XL1 chain and the <span class="mono">xl1-cli</span> this node runs</span>
        <span>${MARK_OXYON} <a href="${esc(d.build.brandUrl)}" target="_blank" rel="noopener noreferrer">${esc(d.build.brandName)}</a>
          — this dashboard, independent and
          <a href="${esc(d.build.source)}" target="_blank" rel="noopener noreferrer">open</a></span>
      </div>` : ''}
    </section>`)
  }

  // Trends — days, not minutes. The in-memory sparklines above reset with the
  // container; this survives, which is the only way to answer "did it earn
  // anything last week".
  const tr = d.trend
  if (tr && (tr.daily?.length || tr.error)) {
    const days = tr.daily ?? []
    const recent = days.slice(-14)
    const maxB = Math.max(1, ...recent.map((x) => x.blocks))
    const maxE = Math.max(1, ...recent.map((x) => x.earned))
    const totalB = days.reduce((a, x) => a + x.blocks, 0)
    const totalE = days.reduce((a, x) => a + x.earned, 0)
    // Thicker bars with the number under each one. A bar chart with no scale is
    // a shape; the value is what makes it a measurement. Only the last few days
    // are labelled when the window is long, so the labels never collide.
    const bars = (vals, max, fmt = (n) => num(n)) => {
      const label = vals.length <= 10
      return `<div class="trendbars">${vals.map((v) => `
        <div class="trendbar" title="${esc(v.day)}: ${fmt(v.n)}">
          <div class="trendbar-fill" style="height:${Math.max(3, (v.n / max) * 100)}%"></div>
          ${label ? `<div class="trendbar-n">${fmt(v.n)}</div>` : ''}
        </div>`).join('')}</div>`
    }

    // Nothing recorded yet is not zero blocks and a peak of one. Say what is
    // actually true — that it has not been running long enough — rather than
    // charting placeholders that read as a node which earned nothing.
    const empty = days.length === 0
    cards.push(`<section style="--c: var(--c-trend)">
      <h2><span class="ico" aria-hidden="true">📈</span>Trends</h2>
      ${tr.error ? `<div class="err">${esc(tr.error)}</div>` : ''}
      ${empty ? `
        <div class="big sub" style="font-size:16px">collecting…</div>
        <div class="sub">One sample every 5 minutes. The first full day appears tomorrow;
          history survives restarts once the store is writable.</div>
      ` : `
        <div class="big">${num(totalB)}</div>
        <div class="sub">blocks over ${num(days.length)} day(s) · ${num(tr.points)} samples</div>
        ${bars(recent.map((x) => ({ day: x.day, n: x.blocks })), maxB)}
        <div class="sparkfoot"><span>blocks/day</span><span>best ${num(maxB)} · avg ${num(Math.round(totalB / days.length))}</span></div>
        ${bars(recent.map((x) => ({ day: x.day, n: x.earned })), maxE, (n) => num(Math.round(n)))}
        <div class="sparkfoot"><span>XL1/day</span><span>best ${num(Math.round(maxE))} · avg ${num(Math.round(totalE / days.length))}</span></div>
        ${tiles([
          ['Earned', num(Number(totalE.toFixed(2))), `over ${num(days.length)}d`],
          ['Best day', num(maxB), 'blocks'],
          ['Avg/day', num(Number((totalB / days.length).toFixed(1))), 'blocks'],
          ['Retained', `${num(tr.retainDays)}d`, 'rolling window'],
        ])}
      `}
    </section>`)
  }

  // System
  const s = d.system
  if (s?.ok) {
    const t = s.throttle
    // Headroom, not throttle state. The soft limit is raised to 70 °C at
    // provision time and the hard limit is 85 °C, so 65 °C was amber for a
    // machine that was working exactly as configured.
    const tempCls = s.cpuTempC >= 80 ? 'bad' : s.cpuTempC >= 75 ? 'warn' : 'ok'
    // The headline is whatever this machine can actually measure. A Pi throttles
    // on heat, so temperature is the number that matters and it has a sensor for
    // it. Windows exposes no CPU temperature without vendor drivers and has no
    // load average at all, so printing "—°C" and "load undefined" was the card
    // describing a Pi it was not running on.
    const hasTemp = Number.isFinite(s.cpuTempC)
    const hasLoad = Array.isArray(s.loadAverage) && s.loadAverage.length > 0
    const headline = hasTemp
      ? `<div class="big ${tempCls}">${s.cpuTempC}°C</div><div class="sub">CPU temperature</div>`
      : Number.isFinite(s.cpuPercent)
        ? `<div class="big">${s.cpuPercent}<span style="font-size:14px;color:var(--muted)">% CPU</span></div>
           <div class="sub">across ${num(s.cpuCount)} cores</div>`
        : `<div class="big">${s.memory.usedPercent}<span style="font-size:14px;color:var(--muted)">% RAM</span></div>
           <div class="sub">memory in use</div>`
    cards.push(`<section style="--c: var(--c-pi)">
      <h2><span class="ico" aria-hidden="true">${s.platform === 'windows' ? '🖥️' : '🍓'}</span>${s.platform === 'windows' ? 'Host' : 'Raspberry Pi'}</h2>
      ${headline}
      <div class="sub">${esc(s.hostname)} · up ${dur(s.uptimeSeconds)}${hasLoad ? ` · load ${s.loadAverage.join(' ')}` : ''}</div>
      ${hasTemp ? spark(d.history?.tempC) : ''}
      ${tiles([
        ['RAM', `${s.memory.usedPercent}%`, `${bytes(s.memory.totalBytes - s.memory.availableBytes)} of ${bytes(s.memory.totalBytes)}`],
        s.swap?.totalBytes > 0 && ['Swap', `${s.swap.usedPercent}%`, `${bytes(s.swap.usedBytes)} of ${bytes(s.swap.totalBytes)}`],
        s.disk && ['Disk', `${s.disk.usedPercent}%`, `${bytes(s.disk.freeBytes)} free`],
        s.cpuPercent !== undefined
          ? ['CPU', `${s.cpuPercent}%`, `${s.cpuCount} cores`]
          : ['Load', `${s.loadAverage?.[0] ?? '—'}`, `${s.cpuCount} cores`],
        t && ['Power', t.undervoltageNow ? '<span class="bad">LOW</span>' : t.undervoltageSinceBoot ? '<span class="warn">dipped</span>' : '<span class="ok">stable</span>',
              t.undervoltageNow ? 'undervolting now' : t.undervoltageSinceBoot ? 'since boot' : '5V holding'],
        // Both limits, not just the hard one. Reading bits 2/18 alone showed
        // "none" in green on a Pi whose soft limit had been clocking it from
        // 1.4 GHz to 1.2 GHz — the gentler limit is the one a 3 B+ actually
        // hits, so the tile was silent about the only throttling that happens.
        t && ['Throttle',
              t.throttledNow ? '<span class="bad">HARD</span>'
              : t.softTempLimitNow ? '<span class="bad">HEAT</span>'
              : (t.throttledSinceBoot || t.softTempLimitSinceBoot) ? '<span class="warn">earlier</span>'
              : '<span class="ok">none</span>',
              t.throttledNow ? '85°C limit reached'
              : t.softTempLimitNow ? 'clocked down to 1.2 GHz'
              : t.throttledSinceBoot ? '85°C limit, since boot'
              : t.softTempLimitSinceBoot ? 'heat, since boot'
              : 'full clock'],
      ])}
      ${bar(s.memory.usedPercent)}
    </section>`)
  }

  // Operations — score, bottleneck, competition. All arithmetic over data that
  // is already in this payload; the card issues no request of its own.
  const ops = dv.operations
  if (ops && (ops.score !== undefined || ops.bottleneck)) {
    // Confidence is shown wherever a number could be read as more solid than it
    // is. A percentile over 19 samples and one over 13,000 look identical
    // otherwise, and only one of them is worth acting on.
    const conf = (n, warm = 30, high = 300) => {
      if (!Number.isFinite(n)) return ''
      const label = n >= high ? `high confidence · ${num(n)}` : n >= warm ? `limited · ${num(n)}` : `warming up · ${num(n)}`
      return `<span class="conf" title="calculated from ${num(n)} samples">${label}</span>`
    }
    const cls = (v) => (v >= 75 ? '' : v >= 50 ? 'mid' : 'low')

    const comp = ops.competition
    cards.push(`<section style="--c: var(--c-producer)">
      <h2><span class="ico" aria-hidden="true">🎯</span>Operations</h2>
      ${ops.score !== undefined
        ? `<div class="big">${num(ops.score)} <span style="font-size:14px;color:var(--muted)">/ 100</span></div>
           <div class="sub" title="The mean of whichever components could be measured. A component with no data is left out rather than scored zero.">mean of ${num(ops.components.length)} measured component(s)</div>
           ${ops.components.map((c) => `<div class="score-row" title="${esc(c.why)}">
              <span class="sub">${esc(c.label)}</span><span class="mono">${num(c.value)}</span>
              <span class="score-bar ${cls(c.value)}"><i style="width:${Math.max(2, c.value)}%"></i></span>
            </div>`).join('')}`
        : '<div class="sub">Not enough measured components for a score yet.</div>'}

      ${ops.bottleneck ? `<div class="sub" style="margin-top:10px">Bottleneck</div>
        <div class="${ops.bottleneck.key === 'none' ? 'ok' : ops.bottleneck.key === 'unknown' ? 'sub' : 'warn'}">
          ${ops.bottleneck.key === 'none' ? '✓ ' : ops.bottleneck.key === 'unknown' ? '' : '! '}${esc(ops.bottleneck.text)}
        </div>` : ''}

      ${comp ? `<div class="sub" style="margin-top:10px">Field of ${num(comp.producers)}</div>
        ${dl([
          ['Our share', Number.isFinite(comp.ourShare) ? `${comp.ourShare}%` : '—'],
          ['Leader', `${comp.leaderShare}%`],
          ['Top 3 combined', `${comp.topThreeShare}%`],
          ['vs median', Number.isFinite(comp.vsMedian)
            ? `<span class="${comp.vsMedian >= 0 ? 'ok' : 'warn'}">${comp.vsMedian >= 0 ? '↑' : '↓'} ${Math.abs(comp.vsMedian)} pts</span>` : '—'],
          ['vs leader', Number.isFinite(comp.vsLeader) ? `${comp.vsLeader} pts` : '—'],
        ])}` : ''}

      ${(ops.sinceWin !== undefined || ops.longestGap !== undefined) ? tiles([
        ['Since last win', ops.sinceWin !== undefined ? `${num(ops.sinceWin)}` : '—', 'blocks'],
        ['Longest gap', ops.longestGap !== undefined ? `${num(ops.longestGap)}` : '—', `in last ${num(ops.ringBlocks)}`],
      ]) : ''}

      ${ops.stages ? `<div class="sub" style="margin-top:10px">Where a cycle spends its time ${conf(dv.latency?.samples)}</div>
        ${(() => {
          const rows = Object.entries(ops.stages).filter(([, v]) => Number.isFinite(v))
          const top = Math.max(...rows.map(([, v]) => v), 1)
          const names = { headFetch: 'head fetch', blockProduction: 'build', mempoolTx: 'mempool tx', mempoolBlocks: 'mempool blocks', submit: 'submit' }
          return rows.sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="lat-row">
            <span class="sub">${esc(names[k] ?? k)}</span><span class="mono">${num(v)} ms</span>
            <span class="lat-bar"><i style="width:${Math.max(2, (v / top) * 100)}%"></i></span>
          </div>`).join('')
        })()}
        <div class="sub" style="margin-top:5px"
          title="These nest: a cycle contains the head fetch and the build, and the build contains the mempool calls. They are durations, not a waterfall, and do not sum to the cycle.">
          p50 per stage · nested, not a waterfall</div>` : ''}
    </section>`)
  }

  // Candidate race — why blocks are being lost, from telemetry already collected.
  //
  // The counters are mixed-source on purpose and the card says so. Losses and
  // retries are the producer's own log, the only place that records WHY a
  // candidate died. Wins are the chain scan, because "Published block" in the
  // log means submitted, not accepted — treating it as success is the bug that
  // once had this dashboard reporting zero blocks for a node producing several
  // every ten minutes.
  const race = dv.race
  if (race && (race.built !== undefined || race.chainBlocks)) {
    const mins = (sec) => (sec >= 3600 ? `${(sec / 3600).toFixed(1)}h` : `${Math.round(sec / 60)}m`)
    // The pulse reads oldest-left. A win is taller AND accented, so the strip
    // survives greyscale and colour-blindness.
    const pulse = (race.pulse ?? []).length > 0
      ? `<div class="pulse" role="img" aria-label="${num(race.won)} of the last ${num(race.chainBlocks)} chain blocks were produced by this node">
           ${race.pulse.map((w) => `<i class="${w ? 'win' : ''}"></i>`).join('')}
         </div>
         <div class="sub">last ${num(race.chainBlocks)} chain blocks${race.chainWindowSeconds ? ` · ${mins(race.chainWindowSeconds)}` : ''} · <span class="ok">${num(race.won)} won</span></div>`
      : ''

    // Share of losses, not of builds: the question is "when we lose, why".
    const reasons = (race.reasons ?? []).length > 0
      ? `<div class="sub" style="margin-top:10px">Why candidates lost${race.observedSeconds ? ` · last ${mins(race.observedSeconds)}` : ''}</div>`
        + race.reasons.map((r) => `<div class="reason">
             <span>${esc(r.label)}</span><span class="mono">${num(r.count)} · ${r.percent}%</span>
             <span class="reason-bar"><i style="width:${Math.max(2, r.percent)}%"></i></span>
           </div>`).join('')
      : '<div class="sub" style="margin-top:10px">No candidates rejected in the window.</div>'

    cards.push(`<section style="--c: var(--c-producer)">
      <h2><span class="ico" aria-hidden="true">⚔️</span>Candidate race</h2>
      <div class="big">${race.won !== undefined ? num(race.won) : '—'} <span style="font-size:14px;color:var(--muted)">won</span></div>
      <div class="sub" title="Wins are counted from the chain scan. A log line saying &quot;Published block&quot; means submitted, not accepted.">of ${num(race.chainBlocks)} recent blocks · chain-counted</div>
      ${pulse}
      ${tiles([
        ['Built', race.built !== undefined ? num(race.built) : '—', race.observedSeconds ? mins(race.observedSeconds) : 'log window'],
        ['Lost', race.lostTotal !== undefined ? num(race.lostTotal) : '—', 'rejected locally'],
        ['Retries', race.retries !== undefined ? num(race.retries) : '—', 'rebuilt and resubmitted'],
        // The rate the whole card is about, and the one number here that is
        // comparable between machines: wins over the chain blocks we watched.
        ['Win rate', (race.won !== undefined && race.chainBlocks)
          ? `${((race.won / race.chainBlocks) * 100).toFixed(1)}%` : '—', 'of recent blocks'],
      ])}
      ${reasons}
    </section>`)
  }

  // Latency — the question "is it laggy?" answered without guessing.
  //
  // Every number here was already computed by the producer: ProducerActor times
  // headFetch on every check and the collector reads the snapshot off the health
  // port. No ping of our own, deliberately. A dashboard that probed the gateway
  // itself would add requests to the shared endpoint this node competes on, to
  // re-derive a figure the node had already measured on the path that matters.
  //
  // The split is the point. The floor is what the wire costs; the gap above it
  // is this machine parsing and validating what came back. One of those is
  // XYO's problem and the other is yours, and a single round-trip number cannot
  // tell you which you have.
  const lat = dv.latency
  if (lat) {
    const localPart = lat.localMs !== undefined && lat.wireFloorMs !== undefined
      ? `${num(lat.localMs)} ms of it local`
      : 'local share unknown'
    cards.push(`<section style="--c: var(--c-chain)">
      <h2><span class="ico" aria-hidden="true">📡</span>Latency</h2>
      <div class="big">${num(lat.typicalMs)} <span style="font-size:14px;color:var(--muted)">ms typical</span></div>
      <div class="sub">head fetch, ${localPart}</div>
      ${(() => {
        // Bars share one scale so the comparison is honest — the eye is being
        // asked to judge proportion, and per-row scaling would make the wire
        // floor look the same size as a 2.4s cycle.
        const rows = [
          ['wire', 'Wire', lat.wireFloorMs, 'the network itself: the fastest head fetch seen'],
          ['', 'p50', lat.typicalMs, 'half of head fetches were faster than this'],
          ['tail', 'p95', lat.p95Ms, 'the slow 5% — what a bad moment costs'],
          ['tail', 'Cycle', lat.cycleP95Ms, 'a whole production cycle at p95, budget is 1000ms'],
        ].filter(([, , v]) => Number.isFinite(v))
        const top = Math.max(...rows.map(([, , v]) => v), 1)
        return rows.map(([cls, label, v, tip]) => `<div class="lat-row" title="${esc(tip)}">
          <span class="sub">${esc(label)}</span>
          <span class="mono">${num(v)} ms</span>
          <span class="lat-bar ${cls}"><i style="width:${Math.max(2, (v / top) * 100)}%"></i></span>
        </div>`).join('')
      })()}
      ${lat.localMs !== undefined ? `<div class="sub" style="margin-top:7px"
        title="The wire floor is the fastest head fetch seen — the network. Everything above it is this machine parsing and validating the answer.">
        <strong>+${num(lat.localMs)} ms</strong> local · ${num(lat.samples)} samples</div>` : ''}
    </section>`)
  }

  // Producer standings — who else is signing blocks, and where we sit.
  //
  // Counted from the same scan that produces "Blocks produced" above, so the
  // two can never disagree. The denominator is blocks actually read, which is
  // why the sample size is printed rather than assumed from the height range.
  const pb = d.peers
  if (pb && pb.producers > 0) {
    const short = (a) => `${String(a).slice(0, 6)}…${String(a).slice(-4)}`
    // A named producer shows its name with the hex kept alongside, not replaced.
    // The address is the identity; the label is a convenience, and dropping the
    // hex would leave nothing to check a suspicious row against.
    const nameCell = (r) => {
      const name = r.label ?? (r.isSelf ? 'this node' : undefined)
      const hex = r.url
        ? `<a class="mono" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" title="${esc(r.address)}">${esc(short(r.address))}</a>`
        : `<span class="mono" title="${esc(r.address)}">${esc(short(r.address))}</span>`
      return name ? `<span class="peer-name">${esc(name)}</span> ${hex}` : hex
    }

    const rows = [...(pb.top ?? [])]
    // Our own row matters more than the cut-off. If we rank below the visible
    // top, show us anyway under a break rather than leaving the operator to
    // conclude their node is not producing at all.
    const shown = new Set(rows.map((r) => r.address))
    const outside = pb.self && !shown.has(pb.self.address) ? pb.self : undefined

    // Bars scale to the leader, not to 100. With six producers splitting a
    // chain, every bar against a fixed 100 would be a stub and the ranking —
    // the thing this table exists to show — would be invisible.
    const lead = Math.max(...rows.map((r) => r.sharePercent ?? 0), (pb.self?.sharePercent ?? 0), 0.0001)

    // Window figures are looked up per address rather than re-ranked, so a row
    // keeps its place in the overall table while showing what it did today.
    // A producer with no blocks in a window is a real zero, not missing data —
    // but only once that window has been filled, hence the dash while a
    // backfill is still walking backwards.
    const wToday = pb.windows?.today
    const wWeek = pb.windows?.week
    const cell = (w, addr) => {
      if (!w) return '—'
      const v = w.blocksByAddress?.[addr]
      return num(v ?? 0)
    }

    const tr_ = (r, cls = '') => `<tr class="${cls}${r.isSelf ? ' self' : ''}">
      <td>${num(r.rank)}</td>
      <td>${nameCell(r)}</td>
      <td class="barcell"><div class="peer-bar"><i style="width:${Math.max(r.sharePercent ? 2 : 0, ((r.sharePercent ?? 0) / lead) * 100)}%"></i></div></td>
      <td>${cell(wToday, r.address)}</td>
      <td>${cell(wWeek, r.address)}</td>
      <td>${num(r.blocks)}</td>
      <td>${r.sharePercent !== undefined ? `${r.sharePercent}%` : '—'}</td>
    </tr>`

    const leader = rows[0]
    const mine = pb.self
    // The comparison an operator actually wants: not the raw count, but how far
    // off the top this node is. Same-rank-1 says so instead of printing "0
    // behind", which reads like a deficit.
    // Said per window, because they routinely disagree and the disagreement is
    // the point: a node that was offline for two days is far behind on the
    // total and even for today, and only the second number describes how it is
    // running now.
    const standing = (w, label) => {
      if (!w?.self || !w.leader) return ''
      const gap = w.leader.blocks - w.self.blocks
      const runnerUp = w.top?.[1]
      const text = w.self.rank === 1
        ? `leading by ${num(w.self.blocks - (runnerUp?.blocks ?? w.self.blocks))}`
        : `${num(gap)} behind the leader`
      return `<div class="sub">${label}: #${num(w.self.rank)} of ${num(w.producers)} · ${num(w.self.blocks)} block(s) · ${text}</div>`
    }

    const gapLine = (!mine || !leader) ? ''
      : `${mine.rank === 1
          ? `<div class="sub">overall: leading by ${num(leader.blocks - (rows[1]?.blocks ?? leader.blocks))} block(s)</div>`
          : `<div class="sub">overall: ${num(leader.blocks - mine.blocks)} block(s) behind the leader</div>`}
         ${standing(wToday, 'today')}
         ${standing(wWeek, '7 days')}`

    cards.push(`<section class="wide" style="--c: var(--c-peers)">
      <h2><span class="ico" aria-hidden="true">🏁</span>Producer standings</h2>
      ${mine
        ? `<div class="big">#${num(mine.rank)} <span style="font-size:14px;color:var(--muted)">of ${num(pb.producers)}</span></div>
           ${gapLine}`
        : `<div class="big sub" style="font-size:16px">not seen yet</div>
           <div class="sub">this node has not signed a block in the ${num(pb.scannedBlocks)} scanned</div>`}
      ${pb.error ? `<div class="err" style="margin-top:8px">${esc(pb.error)}</div>` : ''}
      <div class="board-wrap">
        <table class="board">
          <thead><tr><th>#</th><th>Producer</th><th></th><th>Today</th><th>7d</th><th>Total</th><th>Share</th></tr></thead>
          <tbody>
            ${rows.map((r) => tr_(r)).join('')}
            ${outside ? tr_(outside, 'gap ') : ''}
          </tbody>
        </table>
      </div>
      <div class="sub" style="margin-top:8px">
        ${num(pb.scannedBlocks)} blocks sampled${pb.scannedFrom !== undefined ? ` (#${num(pb.scannedFrom)}–#${num(pb.scannedTo)})` : ''}${pb.since ? ` · since ${new Date(pb.since).toLocaleDateString()}` : ''}.
        <span title="Totals persist across restarts. Day buckets are kept for ${num(pb.daysKept ?? 0)} days.">Days are ${esc(pb.dayTz ?? 'UTC')}.</span>
      </div>
      ${pb.dayTzError ? `<div class="sub warn">${esc(pb.dayTzError)}</div>` : ''}
      ${pb.daysError ? `<div class="sub warn">day history: ${esc(pb.daysError)}</div>` : ''}
      ${pb.daysComplete === false
        ? `<div class="sub warn">Day history still filling in — it reaches back to #${num(pb.daysFrom)} of #${num(pb.scannedFrom)}, so older windows undercount until it finishes.</div>`
        : ''}
      ${pb.undated ? `<div class="sub warn">${num(pb.undated)} block(s) carried no timestamp and are in the totals only.</div>` : ''}
      ${pb.multiSigner ? `<div class="sub">Some blocks carry more than one signer, so the share column can total over 100%.</div>` : ''}
      ${(pb.labels?.rejected ?? []).map((x) => `<div class="sub warn">DASH_PEER_LABELS: ${esc(x)}</div>`).join('')}
      ${(pb.labels?.ambiguous ?? []).map((x) => `<div class="sub warn">Label “${esc(x.name)}” (${esc(x.key)}) ${
        x.clash ? `collides with “${esc(x.clash)}” on the same address` : `matches ${num(x.matches)} producers — left unlabelled rather than guessed`}</div>`).join('')}
      ${(pb.labels?.unmatched ?? []).map((x) => `<div class="sub">Label “${esc(x.name)}” (${esc(x.key)}) matches no producer in this sample yet.</div>`).join('')}
      ${dv.productionBehind ? `<div class="sub warn">${num(dv.productionBehind)} block(s) still to catch up on.</div>` : ''}
    </section>`)
  }

  // Log tail, newest first. The interesting line is always the most recent one,
  // and a panel that opens scrolled to the oldest line makes the reader scroll
  // past forty lines of history to reach it.
  if (d.node?.recentLog?.length) {
    cards.push(`<section class="wide" style="--c: var(--c-log)">
      <h2><span class="ico" aria-hidden="true">📜</span>Producer log — newest first (${d.node.recentLog.length} lines)</h2>
      <pre class="log">${esc([...d.node.recentLog].reverse().join('\n'))}</pre>
      <div class="logfoot">Most recent at the top. Collected ${d.node.ageSeconds ?? '?'}s ago.</div>
    </section>`)
  }

  // Card order is a product decision, not an artefact of the order the code
  // happens to build them in. Sorted here so a new card can be written wherever
  // it fits in the file and still land where an operator expects it.
  //
  // Ranked by what is asked first: is it alive and what is it running, is it
  // winning, how is it performing, then the chain, then money, then the host,
  // then history and raw output. Software & host sits directly under Producer
  // because they answer one question between them — what is running, and is it
  // the right version.
  const CARD_ORDER = [
    'Producer cannot produce',   // the banner, when it exists, always first
    'Producer log',              // matched before 'Producer' — startsWith would
                                 // otherwise claim it for the producer card
    'Producer standings',
    'Producer',
    'Software & host',
    'Candidate race',
    'Operations',
    'Chain',
    'Latency',
    'Rewards',
    'Raspberry Pi',
    'Host',
    'Trends',
  ]
  // Where each of those actually goes. Kept separate from the match list so the
  // matching order (longest-prefix-first) cannot be confused with the display
  // order, which is the bug that would put the log second.
  //
  // Pairs sit next to each other because they answer one question between them:
  // Producer with Software & host (what is running, is it the right version),
  // Candidate race with Latency (are we winning, and is speed why not), Rewards
  // with Trends (what came in, and is it rising).
  //
  // The last two are the full-width ones. Standings is a seven-row table and the
  // log is a scroll box; both stretch edge to edge, so anything after them would
  // read as an afterthought below a wall. Standings second to last, log last.
  const CARD_RANK = {
    'Producer cannot produce': 0,
    Producer: 1,
    'Raspberry Pi': 2,
    Host: 2,
    'Candidate race': 3,
    Latency: 4,
    Operations: 5,
    Chain: 6,
    Trends: 7,
    Rewards: 8,
    'Software & host': 9,
    'Producer standings': 10,
    'Producer log': 11,
  }
  const rankOf = (html) => {
    const m = html.match(/<h2[^>]*>(?:\s*<span[^>]*>[^<]*<\/span>)?\s*([^<]+)/)
    const title = m ? m[1].replaceAll('&amp;', '&').trim() : ''
    const key = CARD_ORDER.find((t) => title.startsWith(t))
    // An unrecognised card keeps its position rather than being flung to one
    // end: a card added later should look misplaced, not disappear.
    return key === undefined ? 50 : CARD_RANK[key]
  }
  // Stable sort, so cards sharing a rank keep the order they were built in.
  const ordered = cards
    .map((html, i) => [rankOf(html), i, html])
    .sort((a, b) => a[0] - b[0] || a[1] - b[1])
    .map(([, , html]) => html)

  // Ordering alone only makes a pair adjacent, and on a wide grid adjacent means
  // side by side. To actually put Latency UNDER Candidate race at every width,
  // the two are wrapped in one grid item and stacked inside it. Deterministic,
  // and each card keeps its own header rather than being merged into one.
  // Each pair becomes ONE grid item with the two cards stacked inside, so the
  // second sits under the first at every width and the accent colours still
  // separate them. Pairing also evens the item heights out, which is what was
  // making the grid ragged: eleven cards of wildly different length left holes
  // wherever a short one sat beside a tall one.
  const PAIRS = [
    ['Producer', 'Raspberry Pi'],      // the process, and the machine under it
    ['Producer', 'Host'],              // same, when the host is not a Pi
    ['Candidate race', 'Latency'],     // are we winning, and is speed why not
    ['Chain', 'Trends'],               // the chain now, and the chain over days
    ['Rewards', 'Software & host'],    // the earnings, and the build earning them
  ]
  const titleOf = (html) => {
    const m = html.match(/<h2[^>]*>(?:\s*<span[^>]*>[^<]*<\/span>)?\s*([^<]+)/)
    return m ? m[1].replaceAll('&amp;', '&').trim() : ''
  }
  const out = []
  for (let i = 0; i < ordered.length; i++) {
    const a = titleOf(ordered[i])
    const b = i + 1 < ordered.length ? titleOf(ordered[i + 1]) : ''
    // Only pair when BOTH are present. A card hidden for want of data must not
    // leave its partner wrapped in a stack of one, which would column it oddly.
    const pair = PAIRS.find(([x, y]) => a.startsWith(x) && b.startsWith(y))
    if (pair) {
      out.push(`<div class="stack">${ordered[i]}${ordered[i + 1]}</div>`)
      i++
    } else {
      out.push(ordered[i])
    }
  }
  $('grid').innerHTML = out.join('')
  $('foot').innerHTML = (d.problems?.length
    ? `<ul class="problems">${d.problems.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>`
    : '')
    + `<div style="margin-top:8px">updated ${new Date(d.generatedAt).toLocaleTimeString()} · dashboard up since ${new Date(d.dashboardStartedAt).toLocaleString()} · <a href="/api/status${location.search}">JSON</a></div>`
    + (d.build ? `<div>build ${esc(d.build.version)}${d.build.commit && d.build.commit !== 'unknown' ? ` · ${esc(d.build.commit)}` : ''}${d.build.builtAt && d.build.builtAt !== 'unknown' ? ` · built ${new Date(d.build.builtAt).toLocaleString()}` : ''}</div>` : '')
    // Said plainly, on every page, rather than left to be inferred. Someone
    // shown a screenshot of this should not come away thinking XYO shipped it.
    + `<div class="whose">
         <span class="who">🛠️ Built by LewSales</span>
         <span class="sep">·</span>
         <span>Independent community project — <strong>not affiliated with, endorsed by, or supported by XYO Network</strong>.</span>
         <span class="sep">·</span>
         <a href="${esc(d.build?.source ?? 'https://github.com/LewSales/xl1-block-producer-pi')}" target="_blank" rel="noopener noreferrer">source &amp; issues ↗</a>
       </div>`
}

async function tick() {
  try {
    const res = await fetch(`/api/status${location.search}`, { cache: 'no-store' })
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    render(await res.json())
  } catch (e) {
    $('overall').textContent = 'dashboard unreachable'
    $('overall').className = 'pill down'
    $('foot').textContent = String(e)
  }
}
tick()
setInterval(tick, 5000)
</script>
</body>
</html>
